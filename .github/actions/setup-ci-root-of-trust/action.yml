name: Setup ephemeral CI Root of Trust
description: Generate a job-scoped Ed25519 trust anchor for disposable CI runtime boot checks.
runs:
  using: composite
  steps:
    - name: Generate ephemeral CI public trust anchor
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import base64
        import os
        from cryptography.hazmat.primitives import serialization
        from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

        # The private key exists only in this short-lived process. CI boot checks
        # need only the public trust anchor; no private key is exported or stored.
        private_key = Ed25519PrivateKey.generate()
        public_key = private_key.public_key().public_bytes(
            encoding=serialization.Encoding.Raw,
            format=serialization.PublicFormat.Raw,
        )
        owner_id = (
            f"gerchain-ci-{os.environ['GITHUB_RUN_ID']}-"
            f"{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['GITHUB_JOB']}"
        )
        public_key_b64 = base64.b64encode(public_key).decode("ascii")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
            env_file.write(f"GERCHAIN_AUTH_OWNER_ID={owner_id}\n")
            env_file.write(f"GERCHAIN_AUTH_PUBLIC_KEY_B64={public_key_b64}\n")
        del private_key
        print("CI_ROOT_OF_TRUST=CONFIGURED")
        print(f"CI_ROOT_OF_TRUST_OWNER_ID={owner_id}")
        PY
