name: PostgreSQL Migration and Production Proof

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_POSTGRES_URL: postgresql://gerchain:gerchain@localhost:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql://gerchain:gerchain@localhost:5432/gerchain_test
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dee-security.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt pytest
      - name: Prove concurrent migration publication
        run: pytest -q tests/postgres/test_migration_concurrency.py
      - name: Prove migration rollback
        run: pytest -q tests/postgres/test_migration_rollback.py
      - name: Prove production runtime boot and canonical schema
        run: pytest -q tests/services/test_production_runtime_factory_postgres.py
