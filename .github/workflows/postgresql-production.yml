name: PostgreSQL production re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

jobs:
  postgresql-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gerchain -d gerchain_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
      GERCHAIN_ESCROW_ID: ci-boot-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: USD
      GERCHAIN_WITNESS_ID: ci-boot-witness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run PostgreSQL production flow
        run: pytest -q tests/integration/test_production_runtime_postgresql.py
