name: PostgreSQL Production Evidence

on:
  push:
    branches:
      - "feat/ea21-transaction-aware-ledger"
  pull_request:
    branches:
      - main

jobs:
  production-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt pytest

      - name: Run PostgreSQL canonical production re-performance
        run: python -m pytest -q tests/integration/test_production_postgres_boot.py tests/integration/test_production_postgres_canonical.py
