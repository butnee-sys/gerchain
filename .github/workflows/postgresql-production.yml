name: PostgreSQL production re-performance

on:
  push:
    branches:
      - main
      - feat/ea21-transaction-aware-ledger
  pull_request:

jobs:
  postgres-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gerchain_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install pytest
      - name: PostgreSQL production re-performance
        run: pytest -q tests/integration/test_postgresql_production_boot.py
