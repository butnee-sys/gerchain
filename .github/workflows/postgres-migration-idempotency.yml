name: PostgreSQL migration idempotency

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ea21-transaction-aware-ledger

jobs:
  escrow-state-constraint-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql://gerchain:gerchain@localhost:5432/gerchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest "psycopg[binary]"
      - name: Verify exact PostgreSQL migration idempotency test
        run: python -m pytest -q tests/persistence/test_ea35_migration_014_idempotency_postgres.py
