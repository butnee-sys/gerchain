name: Canonical PostgreSQL Migration Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "postgres/migrations/**"
      - "postgres/migrations.py"
      - "postgres/migration_runner.py"
      - "scripts/postgres_migration_runner.py"
      - "scripts/verify_canonical_migrations.py"
      - ".github/workflows/canonical-migration-gate.yml"
      - "services/gerchain_runtime_factory.py"

permissions:
  contents: read

jobs:
  canonical-migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: migration_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d migration_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_MIGRATION_TEST_DATABASE_URL: postgresql://gerchain:gerchain@localhost:5432/migration_gate
      MIGRATION_GATE_REPORT: migration-gate-report.json
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated gate dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run canonical migration scenarios only
        id: migration_gate
        run: python scripts/verify_canonical_migrations.py
      - name: Preserve evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-migration-gate-${{ github.sha }}
          path: migration-gate-report.json
          if-no-files-found: error
          retention-days: 90
