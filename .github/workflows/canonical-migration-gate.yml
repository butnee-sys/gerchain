name: Canonical PostgreSQL Migration Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "postgres/migrations/**"
      - "postgres/migrations.py"
      - "postgres/migration_runner.py"
      - "scripts/postgres_migration_runner.py"
      - "scripts/verify_canonical_migrations.py"
      - ".github/workflows/canonical-migration-gate.yml"
      - "services/gerchain_runtime_factory.py"
      - "production_entrypoint.py"
  push:
    paths:
      - "postgres/migrations/**"
      - "postgres/migrations.py"
      - "postgres/migration_runner.py"
      - "scripts/postgres_migration_runner.py"
      - "scripts/verify_canonical_migrations.py"
      - ".github/workflows/canonical-migration-gate.yml"
      - "services/gerchain_runtime_factory.py"
      - "production_entrypoint.py"

permissions:
  contents: read

jobs:
  canonical-migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: migration_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d migration_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      GERCHAIN_MIGRATION_TEST_DATABASE_URL: postgresql://gerchain:gerchain@localhost:5432/migration_gate
      MIGRATION_GATE_REPORT: migration-gate-report.json
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - name: Assert checkout matches requested evidence SHA
        env:
          EXPECTED_COMMIT_SHA: ${{ env.EVIDENCE_SHA }}
        run: |
          python - <<'PY'
          import os, subprocess
          expected = os.environ['EXPECTED_COMMIT_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'EXPECTED_COMMIT_SHA={expected}')
          print(f'CHECKED_OUT_HEAD_SHA={actual}')
          if actual != expected:
              raise SystemExit('FAIL: checkout HEAD differs from evidence SHA')
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated gate dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9"
      - name: Verify frozen canonical migration manifest
        run: python -m pytest -q postgres/tests/test_canonical_migration_manifest.py
      - name: Run canonical migration scenarios only
        id: migration_gate
        run: python scripts/verify_canonical_migrations.py
      - name: Bind migration report to exact checkout SHA
        if: always()
        env:
          EXPECTED_COMMIT_SHA: ${{ env.EVIDENCE_SHA }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = os.environ["EXPECTED_COMMIT_SHA"]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report_path = Path("migration-gate-report.json")
          report = json.loads(report_path.read_text()) if report_path.exists() else {"status": "MISSING"}
          report["commit_sha"] = expected
          report["checked_out_head_sha"] = head
          report["workflow_run_id"] = os.environ["EVIDENCE_RUN_ID"]
          report["workflow_run_attempt"] = int(os.environ["EVIDENCE_RUN_ATTEMPT"])
          report["commit_sha_matches_head"] = expected == head
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          if expected != head:
              raise SystemExit("FAIL: migration evidence SHA does not match checked-out HEAD")
          if report.get("status") != "PASS":
              raise SystemExit("FAIL: migration report status is not PASS")
          PY
      - name: Generate JUnit migration report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('migration-gate-report.json')
          r = json.loads(p.read_text()) if p.exists() else {'status': 'MISSING', 'scenarios': {}}
          cases = []
          for name, scenario in r.get('scenarios', {}).items():
              if scenario.get('status') == 'PASS':
                  cases.append(f'<testcase classname="canonical_migration_gate" name="{name}"/>')
              else:
                  msg = str(r.get('failure', scenario.get('status', 'MISSING'))).replace('&', '&amp;').replace('"', '&quot;')
                  cases.append(f'<testcase classname="canonical_migration_gate" name="{name}"><failure message="{msg}"/></testcase>')
          failures = 0 if r.get('status') == 'PASS' else 1
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + f'<testsuite name="canonical-migration-gate" tests="{len(cases)}" failures="{failures}" errors="0">' + ''.join(cases) + '</testsuite>\n'
          Path('migration-gate-junit.xml').write_text(xml)
          if r.get('status') != 'PASS': raise SystemExit('Migration report is not PASS')
          PY
      - name: Preserve evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-migration-gate-${{ env.EVIDENCE_SHA }}
          path: |
            migration-gate-report.json
            migration-gate-junit.xml
          if-no-files-found: error
          retention-days: 90
