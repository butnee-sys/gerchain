name: SHUUD Feature Smoke

on:
  push:
    branches: ["feature/shuud-mvp-prototype"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL sandbox
        working-directory: apps/shuud/sandbox
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:18000/openapi.json >/dev/null && exit 0
            sleep 2
          done
          docker compose -f apps/shuud/sandbox/docker-compose.yml logs
          exit 1

      - name: Run SHUUD full lifecycle
        env:
          API: http://127.0.0.1:18000/api/v1/shuud
        run: |
          set -euo pipefail
          INCIDENT_JSON=/tmp/incident.json
          curl -fsS -X POST "$API/incidents" -H 'content-type: application/json' \
            -d '{"location":"SANDBOX","vehicle_a":"TEST-A","vehicle_b":"TEST-B","description":"SHUUD feature smoke"}' | tee "$INCIDENT_JSON"
          INCIDENT_ID=$(python -c "import json; print(json.load(open('$INCIDENT_JSON'))['incident_id'])")
          printf '%s\n' "$INCIDENT_ID" > /tmp/shuud_incident_id
          CAPTURED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS -X POST "$API/evidence" -H 'content-type: application/json' \
            -d "{\"incident_id\":\"$INCIDENT_ID\",\"evidence_refs\":[\"FEATURE-MEDIA-001\"],\"gps_coordinates\":\"47.9184,106.9177\",\"captured_at\":\"$CAPTURED_AT\",\"vehicle_identity_refs\":[\"TEST-A\",\"TEST-B\"],\"consent_refs\":[\"CONSENT-A\",\"CONSENT-B\"],\"media_complete\":true}" >/tmp/evidence.json
          curl -fsS -X POST "$API/decisions" -H 'content-type: application/json' \
            -d "{\"incident_id\":\"$INCIDENT_ID\",\"evidence_refs\":[\"FEATURE-MEDIA-001\"],\"damage_estimate_mnt\":500000,\"two_party_consent\":\"PASS\",\"vehicle_identity_verified\":\"PASS\",\"timestamp_location_verified\":\"PASS\",\"media_complete\":\"PASS\",\"no_injury\":\"PASS\",\"no_third_party_property_damage\":\"PASS\",\"dispute_present\":\"PASS\",\"fraud_flag\":\"PASS\",\"insurance_valid\":\"PASS\",\"beneficiary_valid\":\"PASS\",\"witness_verified\":\"PASS\"}" >/tmp/decision.json
          curl -fsS -X POST "$API/escrows" -H 'content-type: application/json' \
            -d "{\"incident_id\":\"$INCIDENT_ID\",\"escrow_id\":\"FEATURE-ESCROW-$INCIDENT_ID\",\"amount_mnt\":500000,\"settlement_provider\":\"NEF\"}" >/tmp/escrow.json
          curl -fsS -X POST "$API/metrics/clearance" -H 'content-type: application/json' \
            -d "{\"incident_id\":\"$INCIDENT_ID\"}" >/tmp/clearance.json
          curl -fsS -X POST "$API/release" -H 'content-type: application/json' \
            -d "{\"incident_id\":\"$INCIDENT_ID\",\"escrow_id\":\"FEATURE-ESCROW-$INCIDENT_ID\"}" >/tmp/release.json
          curl -fsS -X POST "$API/sandbox/metrics/$INCIDENT_ID/economic" -H 'content-type: application/json' \
            -d '{"baseline_seconds":600,"affected_vehicles":2,"vehicle_value_per_minute_mnt":1000,"insurer_cost_per_minute_mnt":500,"public_road_cost_per_minute_mnt":800}' >/tmp/economic.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/incident.json'))['status'] == 'success'
          assert json.load(open('/tmp/decision.json'))['decision'] == 'APPROVE'
          assert json.load(open('/tmp/escrow.json'))['state'] == 'LOCKED'
          assert json.load(open('/tmp/release.json'))['new_state'] == 'RELEASED'
          c=json.load(open('/tmp/clearance.json'))
          assert c['status'] == 'success'
          e=json.load(open('/tmp/economic.json'))
          assert e['economic_measurement']['total_savings_mnt'] >= 0
          print('SHUUD_FEATURE_FULL_LIFECYCLE=PASS')
          print('CLEARANCE_SECONDS=', c['elapsed_seconds'])
          print('WITHIN_120_SECONDS=', c['within_two_minutes'])
          print('TOTAL_SAVINGS_MNT=', e['economic_measurement']['total_savings_mnt'])
          PY

      - name: Restart app and verify PostgreSQL recovery
        working-directory: apps/shuud/sandbox
        run: |
          docker compose stop app
          docker compose rm -f app
          docker compose up -d app
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:18000/openapi.json >/dev/null && break
            sleep 2
          done
          curl -fsS "http://127.0.0.1:18000/api/v1/shuud/metrics/$(cat /tmp/shuud_incident_id)" >/tmp/recovered.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/recovered.json'))
          assert body['status']=='success'
          assert body['snapshot_persisted'] is True
          assert body['milestones']['settlement_released_at'] is not None
          print('SHUUD_POSTGRES_RESTART_RECOVERY=PASS')
          PY

      - name: Dump logs on failure
        if: failure()
        working-directory: apps/shuud/sandbox
        run: docker compose logs --no-color --timestamps || true

      - name: Stop sandbox
        if: always()
        working-directory: apps/shuud/sandbox
        run: docker compose down -v
