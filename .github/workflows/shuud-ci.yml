name: SHUUD CI

on:
  push:
    branches: [main, 'shuud/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SHUUD_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install fastapi httpx sqlalchemy pytest 'psycopg[binary]'
      - name: Run SHUUD adversarial tests
        run: python -m pytest -q tests/test_shuud_verifier_binding.py tests/test_shuud_release_api_invariants.py tests/test_shuud_witness_tamper.py tests/test_shuud_replay_and_timestamp.py tests/test_shuud_release_concurrency.py tests/test_shuud_escrow_creation_concurrency.py tests/test_shuud_evidence_decision_concurrency.py tests/test_shuud_release_api_concurrency.py tests/test_shuud_lifecycle_adversarial.py tests/test_shuud_production_boundary.py tests/test_shuud_production_gate.py tests/test_shuud_persistence.py tests/test_shuud_atomic_settlement.py tests/test_shuud_persistence_adapter.py tests/test_shuud_production_bootstrap.py tests/test_shuud_production_wiring.py tests/test_shuud_failure_consistency.py tests/test_shuud_production_e2e.py tests/test_shuud_publication_outbox.py tests/test_shuud_publication_outbox_concurrency.py tests/test_shuud_transaction_contract.py tests/test_shuud_schema_bootstrap_concurrency.py tests/test_shuud_database_dialect_contract.py tests/test_shuud_postgresql_schema_lock_contract.py tests/test_shuud_postgresql_integration.py
