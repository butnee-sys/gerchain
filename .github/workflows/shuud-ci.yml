name: SHUUD CI

on:
  push:
    branches: [main, 'shuud/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run SHUUD adversarial tests
        run: python -m pytest -q tests/test_shuud_verifier_binding.py tests/test_shuud_release_api_invariants.py tests/test_shuud_witness_tamper.py tests/test_shuud_replay_and_timestamp.py tests/test_shuud_release_concurrency.py tests/test_shuud_escrow_creation_concurrency.py tests/test_shuud_evidence_decision_concurrency.py tests/test_shuud_release_api_concurrency.py tests/test_shuud_lifecycle_adversarial.py tests/test_shuud_production_boundary.py
