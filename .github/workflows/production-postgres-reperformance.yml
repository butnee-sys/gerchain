name: production-postgres-reperformance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger

jobs:
  postgres-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: Run production PostgreSQL re-performance tests
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain
          GERCHAIN_ESCROW_ID: smoke-escrow
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: MNT
          GERCHAIN_WITNESS_ID: smoke-witness
        run: |
          pytest -q tests/persistence/test_deep_value_reconciliation.py tests/services/test_gerchain_runtime_refund_canonical.py tests/services/test_gerchain_runtime_cancel_canonical.py
