name: production-postgres-reperformance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger

jobs:
  postgres-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: |
          set +e
          GERCHAIN_ESCROW_ID=escrow-pg-1 GERCHAIN_ESCROW_AMOUNT=100 GERCHAIN_CURRENCY=USD GERCHAIN_WITNESS_ID=witness-pg-1 timeout 10s python production_entrypoint.py
          rc=$?
          test "$rc" -eq 124
      - run: pytest -q tests/integration/test_postgresql_canonical_flow.py tests/persistence/test_deep_value_reconciliation.py
