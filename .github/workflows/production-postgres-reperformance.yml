name: production-postgres-reperformance

on:
  workflow_dispatch:
jobs:
  postgres-production-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain
      GERCHAIN_ESCROW_ID: smoke-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: USD
      GERCHAIN_WITNESS_ID: smoke-witness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: PostgreSQL canonical runtime smoke
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory

          url = os.environ["GERCHAIN_DATABASE_URL"]
          engine = create_engine(url, pool_pre_ping=True)
          runtime = ProductionRuntimeFactory(
              ProductionRuntimeConfig(
                  database_url=url,
                  escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
                  amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                  currency=os.environ["GERCHAIN_CURRENCY"],
                  witness_id=os.environ["GERCHAIN_WITNESS_ID"],
              ),
              engine=engine,
          ).create()

          assert runtime.is_canonical_ledger_authoritative
          names = set(inspect(engine).get_table_names())
          required = {
              "escrows",
              "gerchain_ledger_accounts",
              "gerchain_ledger_movements",
              "gerchain_transaction_witnesses",
              "gerchain_outbox_events",
              "gerchain_idempotency_records",
          }
          missing = required - names
          assert not missing, f"missing canonical tables: {sorted(missing)}"

          escrow_columns = {c["name"] for c in inspect(engine).get_columns("escrows")}
          required_escrow = {
              "id", "sender_address", "receiver_address", "amount", "state",
              "refund_destination", "currency", "version", "created_at", "updated_at"
          }
          assert required_escrow <= escrow_columns

          engine.dispose()
          print("POSTGRES_CANONICAL_RUNTIME_SMOKE=PASS")
          PY
