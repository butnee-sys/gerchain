name: EAI Production PostgreSQL Re-performance

on:
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]
  pull_request:
    branches: ["main"]

jobs:
  eai-production-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r postgres/requirements-test.txt
          python -m pip install -r requirements-dee-security.txt
      - name: Verify production factory construction
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          from services.gerchain_runtime_factory import ProductionRuntimeFactory
          dsn = os.environ["GERCHAIN_DATABASE_URL"]
          engine = create_engine(dsn, pool_pre_ping=True)
          session_factory = sessionmaker(bind=engine, expire_on_commit=False)
          runtime = ProductionRuntimeFactory.create(
              escrow_id="eai-boot-1",
              amount=100,
              currency="USD",
              witness_id="witness-1",
              engine=engine,
              session_factory=session_factory,
          )
          assert runtime.is_canonical_ledger_authoritative
          print("EAI_PRODUCTION_FACTORY=PASS")
          engine.dispose()
          PY
      - name: Run deep value-truth reconciliation tests
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q tests/persistence/test_deep_value_reconciliation.py
