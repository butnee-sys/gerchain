name: Production PostgreSQL Runtime

on:
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]
  pull_request:
    branches: ["main"]

jobs:
  production-postgresql-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install -r postgres/requirements-test.txt
          python -m pip install -r requirements-dee-security.txt
      - name: Run production PostgreSQL value-flow proof
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q tests/integration/test_production_postgres_runtime.py
