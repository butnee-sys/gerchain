name: EA-36 Independent PostgreSQL Transaction Graph

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/persistence/test_ea36_postgresql_reperformance.py"
      - "persistence/**"
      - "postgres/**"
      - "services/gerchain_runtime_factory.py"
      - ".github/workflows/ea36-postgresql-reperformance.yml"
  push:
    branches:
      - feat/ea35-production-lock-candidate

jobs:
  ea36-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gerchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install -r postgres/requirements-test.txt
      - name: Run independent EA-36 PostgreSQL transaction graph
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/persistence/test_ea36_postgresql_reperformance.py             --junitxml=artifacts/ea36-postgresql-reperformance.xml
      - name: Upload EA-36 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ea36-postgresql-reperformance
          path: artifacts/ea36-postgresql-reperformance.xml
          if-no-files-found: error
