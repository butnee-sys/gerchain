name: PostgreSQL production verification
on:
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]
  pull_request:
jobs:
  postgres-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
      GERCHAIN_ESCROW_ID: escrow-production-test
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: USD
      GERCHAIN_WITNESS_ID: witness-production-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install psycopg[binary] pytest
      - name: Verify production factory construction
        run: |
          python - <<'PY'
          import os
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory
          dsn = os.environ["GERCHAIN_DATABASE_URL"]
          runtime = ProductionRuntimeFactory(ProductionRuntimeConfig(
              database_url=dsn,
              escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
              amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
              currency=os.environ["GERCHAIN_CURRENCY"],
              witness_id=os.environ["GERCHAIN_WITNESS_ID"],
          )).create()
          assert runtime.is_canonical_ledger_authoritative
          print("CANONICAL_LEDGER_AUTHORITY=TRUE")
          PY
      - name: Run persistence and reconciliation tests
        run: pytest --import-mode=importlib -q tests/persistence/test_deep_value_reconciliation.py tests/persistence/test_atomic_ledger_transaction_boundary.py tests/integration/test_postgres_canonical_value_truth.py
