name: PostgreSQL concurrency and migration gate

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-concurrency-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql://gerchain:gerchain@localhost:5432/gerchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run exact migration twice and verify checksum/data stability
        run: python scripts/postgres_concurrency_migration_gate.py
      - name: Record exact revision and migration checksum
        run: |
          echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum postgres/schema/001_concurrency.sql | tee -a "$GITHUB_STEP_SUMMARY"
