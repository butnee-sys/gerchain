name: EA-35 PostgreSQL proof

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
  workflow_dispatch:

jobs:
  postgresql-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dee-security.txt pytest
      - name: PostgreSQL migration concurrency gate
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@localhost:5432/gerchain_test
        run: pytest -q postgres/tests/test_concurrency.py
      - name: PostgreSQL canonical runtime boot
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
        run: pytest -q tests/integration/test_production_runtime_postgresql.py

