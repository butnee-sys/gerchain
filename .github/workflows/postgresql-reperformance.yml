name: PostgreSQL production re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  postgres-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install production dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: gerchain
        run: |
          psql -h 127.0.0.1 -U gerchain -d gerchain -f postgres/schema/001_concurrency.sql
          psql -h 127.0.0.1 -U gerchain -d gerchain -f postgres/schema/002_canonical_production.sql
      - name: Run canonical PostgreSQL re-performance
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain
        run: |
          pytest -q tests/integration/test_postgresql_canonical_value_flow.py
