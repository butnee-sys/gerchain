name: EA-35 PostgreSQL production re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

jobs:
  postgres-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dee-security.txt pytest
      - name: Apply canonical PostgreSQL migrations
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine
          from postgres.migrations import apply_migrations
          from pathlib import Path
          import os
          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"])
          with engine.begin() as connection:
              apply_migrations(connection, Path("postgres/schema"))
          print("POSTGRES_MIGRATIONS=APPLIED")
          PY
      - name: PostgreSQL production re-performance
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: pytest -q tests/integration/test_ea35_postgres_production.py
