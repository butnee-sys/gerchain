name: PostgreSQL production migration gate

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gerchain_test
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain_test@localhost:5432/gerchain_test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record commit and SQL migration checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/commit.txt
          find postgres/schema -type f -name '*.sql' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum | tee artifacts/sql-checksums-before.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dee-security.txt

      - name: Install PostgreSQL driver and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt
          python -m pip install 'psycopg[binary]' pytest

      - name: Verify live PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"])
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT current_database(), current_user, version()"
              )).one()
              print({"database": row[0], "user": row[1], "server": row[2]})
          engine.dispose()
          PY

      - name: Apply canonical versioned PostgreSQL migrations
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          from sqlalchemy.engine import make_url
          from postgres.migrations import apply_migrations, _canonical_migration_files, checksum
          dsn = make_url(os.environ["GERCHAIN_DATABASE_URL"]).set(drivername="postgresql").render_as_string(hide_password=False)
          folder = Path("postgres/migrations")
          with psycopg.connect(dsn) as connection:
              applied = apply_migrations(connection, folder)
          with psycopg.connect(dsn) as connection:
              actual = connection.execute("SELECT version, checksum FROM schema_version ORDER BY version").fetchall()
          expected = [(i, checksum(path.read_text(encoding="utf-8"))) for i, path in enumerate(_canonical_migration_files(folder), 1)]
          assert actual == expected, {"expected": expected, "actual": actual}
          print({"canonical_migrations": len(actual), "newly_applied": list(applied), "history_matches_manifest": True})
          PY

      - name: Enforce migration 1-17 history and write migration-gate-report.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          import psycopg
          from sqlalchemy.engine import make_url
          from postgres.migrations import _canonical_migration_files, checksum

          folder = Path("postgres/migrations")
          files = _canonical_migration_files(folder)
          expected_versions = list(range(1, 18))
          if len(files) != 17:
              raise SystemExit(f"expected exactly 17 canonical migration files, got {len(files)}")
          expected_names = [f"{i:03d}_" for i in expected_versions]
          names = [p.name for p in files]
          if [int(p.name.split("_", 1)[0]) for p in files] != expected_versions:
              raise SystemExit(f"migration sequence must be exactly 1..17 without gaps/duplicates: {names}")
          dsn = make_url(os.environ["GERCHAIN_DATABASE_URL"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as connection:
              history_rows = connection.execute(
                  "SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version"
              ).fetchall()
              duplicate_versions = connection.execute(
                  "SELECT version, COUNT(*) FROM schema_version GROUP BY version HAVING COUNT(*) <> 1"
              ).fetchall()
          expected_checksums = [
              {"version": i, "path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
               "runner_checksum": checksum(path.read_text(encoding="utf-8"))}
              for i, path in enumerate(files, 1)
          ]
          actual_versions = [int(row[0]) for row in history_rows]
          if duplicate_versions:
              raise SystemExit(f"duplicate PostgreSQL migration versions: {duplicate_versions}")
          if actual_versions != expected_versions:
              raise SystemExit(f"PostgreSQL history must be exactly 1..17: {actual_versions}")
          expected_pairs = [(x["version"], x["runner_checksum"]) for x in expected_checksums]
          actual_pairs = [(int(row[0]), row[1]) for row in history_rows]
          if actual_pairs != expected_pairs:
              raise SystemExit(f"PostgreSQL history/checksum mismatch: expected={expected_pairs}; actual={actual_pairs}")
          commit_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = {
              "status": "PASS",
              "commit_sha": commit_sha,
              "workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "migration_count_expected": 17,
              "migration_count_actual": len(history_rows),
              "versions_expected": expected_versions,
              "versions_actual": actual_versions,
              "duplicate_versions": [],
              "migration_sources": expected_checksums,
              "postgresql_history": [
                  {"version": int(row[0]), "checksum": row[1], "applied_at": row[2]}
                  for row in history_rows
              ],
              "checks": {
                  "sequence_1_to_17": True,
                  "no_duplicate_versions": True,
                  "checksums_match": True,
                  "commit_sha_matches_workflow": bool(os.environ.get("GITHUB_SHA")) and commit_sha == os.environ["GITHUB_SHA"],
              },
          }
          if not report["checks"]["commit_sha_matches_workflow"]:
              report["status"] = "FAIL"
          out = Path("artifacts/migration-gate-report.json")
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          if report["status"] != "PASS":
              raise SystemExit("migration-gate-report.json status is not PASS")
          PY

      - name: Boot canonical production entrypoint against migrated PostgreSQL
        env:
          GERCHAIN_ESCROW_ID: migration-gate-escrow
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: MNT
          GERCHAIN_WITNESS_ID: migration-gate-witness
        run: |
          python - <<'PY'
          from production_entrypoint import build_production_runtime
          runtime, engine = build_production_runtime()
          try:
              assert runtime.is_canonical_ledger_authoritative is True
              print({
                  "runtime_mode": runtime.runtime_mode,
                  "canonical_ledger_authoritative": runtime.is_canonical_ledger_authoritative,
                  "postgresql_boot": "PASS",
              })
          finally:
              engine.dispose()
          PY

      - name: Run deep value-truth reconciliation tests with JUnit evidence
        run: python -m pytest -q --junitxml=artifacts/lifecycle-junit.xml tests/persistence/test_deep_value_reconciliation.py

      - name: Build exact-SHA lifecycle evidence report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-postgres
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          workflow_sha = os.environ.get("GITHUB_SHA", "")
          junit_path = Path("artifacts/lifecycle-junit.xml")
          suites = []
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", "0")) for s in suites)
          failures = sum(int(s.get("failures", "0")) for s in suites)
          errors = sum(int(s.get("errors", "0")) for s in suites)
          skipped = sum(int(s.get("skipped", "0")) for s in suites)
          source_paths = [
              "production_entrypoint.py",
              "services/gerchain_runtime_factory.py",
              "persistence/deep_value_reconciliation.py",
              "tests/persistence/test_deep_value_reconciliation.py",
              "postgres/migrations.py",
              ".github/workflows/postgres-production-migration-gate.yml",
          ]
          sources = []
          for name in source_paths:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"required evidence source missing: {name}")
              sources.append({"path": name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          report = {
              "commit_sha": commit,
              "workflow_sha": workflow_sha,
              "sha_match": bool(workflow_sha) and commit == workflow_sha,
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "lifecycle_junit": {
                  "path": str(junit_path),
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "suite_count": len(suites),
                  "present": junit_path.exists(),
              },
              "source_files": sources,
              "migration_files": [
                  {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                  for path in sorted(Path("postgres/migrations").glob("*.sql"))
              ],
          }
          output = Path("artifacts/production-postgres/migration-lifecycle-report.json")
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report["sha_match"]:
              raise SystemExit("commit SHA mismatch in lifecycle evidence")
          if tests <= 0:
              raise SystemExit("JUnit evidence contains zero tests")
          if failures or errors:
              raise SystemExit("JUnit evidence contains failures/errors")
          PY

      - name: Record post-test schema and checksums
        shell: bash
        run: |
          set -euo pipefail
          find postgres/schema -type f -name '*.sql' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum | tee artifacts/sql-checksums-after.txt
          diff -u artifacts/sql-checksums-before.txt artifacts/sql-checksums-after.txt
          PGPASSWORD=gerchain_test psql \
            "postgresql://gerchain@localhost:5432/gerchain_test" \
            -v ON_ERROR_STOP=1 -c \
            "SELECT version, checksum, applied_at FROM schema_version ORDER BY version" \
            > artifacts/schema-version-history.txt

      - name: Final artifact-to-PostgreSQL evidence reconciliation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg
          from sqlalchemy.engine import make_url

          report_path = Path("artifacts/migration-gate-report.json")
          if not report_path.is_file():
              raise SystemExit("migration-gate-report.json missing; refusing to close migration gate")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "PASS":
              raise SystemExit(f"migration report status is not PASS: {report.get('status')}")
          if report.get("commit_sha") != os.environ.get("GITHUB_SHA"):
              raise SystemExit("report commit_sha does not match workflow GITHUB_SHA")
          if report.get("workflow_run_id") != os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("report workflow_run_id mismatch")
          if report.get("workflow_run_attempt") != os.environ.get("GITHUB_RUN_ATTEMPT"):
              raise SystemExit("report workflow_run_attempt mismatch")
          dsn = make_url(os.environ["GERCHAIN_DATABASE_URL"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as connection:
              rows = connection.execute(
                  "SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version"
              ).fetchall()
              duplicates = connection.execute(
                  "SELECT version, COUNT(*) FROM schema_version GROUP BY version HAVING COUNT(*) <> 1"
              ).fetchall()
          actual = [{"version": int(r[0]), "checksum": r[1], "applied_at": r[2]} for r in rows]
          if duplicates:
              raise SystemExit(f"PostgreSQL duplicate versions found at final reconciliation: {duplicates}")
          if actual != report.get("postgresql_history"):
              raise SystemExit("artifact PostgreSQL history does not match final live database history")
          if len(actual) != 17 or [x["version"] for x in actual] != list(range(1, 18)):
              raise SystemExit("final live PostgreSQL history is not exactly versions 1..17")
          print("PASS: migration-gate-report.json matches final PostgreSQL history and run identity")
          PY

      - name: Upload PostgreSQL gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-gate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
