name: PostgreSQL production runtime

on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  postgres-production-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dee-security.txt pytest
      - name: Real PostgreSQL production boot
        run: pytest -q tests/integration/test_ea35_postgres_production.py
