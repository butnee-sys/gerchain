name: PostgreSQL Production Re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

jobs:
  postgres-migration-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain_test
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain_test@localhost:5432/gerchain_test
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install pytest "psycopg[binary]"
      - name: Record tested revision
        run: |
          git rev-parse HEAD
          python --version
          psql "postgresql://gerchain:gerchain_test@localhost:5432/gerchain_test" -c 'SELECT version();'
      - name: Apply canonical migrations and test concurrent PostgreSQL ledger contention
        run: pytest -q -vv tests/persistence/test_postgres_concurrency_migration.py
