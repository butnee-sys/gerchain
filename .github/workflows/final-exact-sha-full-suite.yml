name: FINAL EAI/CORE Exact-SHA Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-eai-core-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Sole automatic authority for fundamental architecture + EAI production evidence.
# SHUUD remains isolated in its own workflows and is intentionally not included.
jobs:
  core-and-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_POSTGRES_DSN: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_MIGRATION_TEST_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_migration_proof
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          if [ -f postgres/requirements-test.txt ]; then pip install -r postgres/requirements-test.txt; fi
          pip install "sqlalchemy>=2" "psycopg[binary]" fastapi uvicorn httpx pytest pyyaml
      - name: Record immutable run identity
        run: |
          echo "EXACT_SHA=$(git rev-parse HEAD)"
          python --version
          python -m pip freeze
      - name: Validate workflow YAML and compile canonical sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yml"):
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          print("WORKFLOW_YAML=PASS")
          PY
          python -m compileall -q services production_entrypoint.py persistence postgres scripts
      - name: Create isolated migration proof database
        run: |
          PGPASSWORD=gerchain createdb -h 127.0.0.1 -U gerchain gerchain_migration_proof
          PGPASSWORD=gerchain psql -h 127.0.0.1 -U gerchain -d gerchain_migration_proof -c "SELECT current_database();"
      - name: Reproduce stale escrow state constraint, apply migrations 015–016, and verify row preservation
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          import psycopg
          from postgres.migrations import _canonical_migration_files, apply_migrations, checksum
          migration_dir = Path("postgres/migrations")
          dsn = os.environ["GERCHAIN_MIGRATION_TEST_DSN"]
          with tempfile.TemporaryDirectory(prefix="gerchain-migrations-001-014-") as tmp:
              baseline_dir = Path(tmp)
              canonical_files = _canonical_migration_files(migration_dir)
              for source in canonical_files[:14]:
                  (baseline_dir / source.name).write_text(source.read_text(encoding="utf-8"), encoding="utf-8")
              with psycopg.connect(dsn) as connection:
                  applied = apply_migrations(connection, baseline_dir)
                  assert applied == tuple(range(1, 15)), applied
                  before = connection.execute("SELECT version, checksum FROM schema_version ORDER BY version").fetchall()
                  expected = {version: checksum((baseline_dir / canonical_files[version - 1].name).read_text(encoding="utf-8")) for version in range(1, 15)}
                  assert [row[0] for row in before] == list(range(1, 15)), before
                  assert dict(before) == expected, (before, expected)
                  connection.execute("""
                    INSERT INTO escrows
                      (id, sender_address, receiver_address, amount, state,
                       condition_desc, updated_at, refund_destination, currency,
                       version, created_at)
                    VALUES
                      ('migration-proof-preserve-001', 'sender-proof', 'receiver-proof',
                       17, 'CREATED', 'migration preservation proof', now(),
                       'sender-proof', 'MNT', 0, now())
                  """)
                  preservation_before = connection.execute("""
                    SELECT id, sender_address, receiver_address, amount, state,
                           condition_desc, refund_destination, currency, version,
                           created_at, updated_at
                    FROM escrows WHERE id = 'migration-proof-preserve-001'
                  """).fetchone()
                  assert preservation_before is not None
                  connection.commit()
                  # Reproduce the exact class of drift: a stale state CHECK appears
                  # alongside the canonical one before the next production boot.
                  connection.execute("""
                    ALTER TABLE escrows
                    ADD CONSTRAINT legacy_reintroduced_state_check
                    CHECK (state IN ('CREATED', 'LOCKED', 'RELEASED'))
                  """)
                  connection.commit()
                  apply_migrations(connection, migration_dir)
                  after = connection.execute("SELECT version, checksum FROM schema_version ORDER BY version").fetchall()
                  assert [row[0] for row in after] == list(range(1, 18)), after
                  assert after[:14] == before, {"before": before, "after": after}
                  assert after[14][1] == checksum((migration_dir / "015_repair_escrow_state_constraint_drift.sql").read_text(encoding="utf-8"))
                  assert after[15][1] == checksum((migration_dir / "016_reconcile_escrow_state_constraint.sql").read_text(encoding="utf-8"))
                  migration_017 = migration_dir / "017_ea35_created_witness_event.sql"
                  migration_017_checksum = checksum(migration_017.read_text(encoding="utf-8"))
                  assert migration_017_checksum == "6f8bf1a7c7d97e74c5a4fd1f86db068b6cf953d803b1a305a24e88f66cf0b8f8", migration_017_checksum
                  assert after[16][1] == migration_017_checksum, {"stored": after[16][1], "expected": migration_017_checksum}
                  witness_constraints = connection.execute("""
                    SELECT conname, convalidated, pg_get_constraintdef(oid)
                    FROM pg_constraint
                    WHERE conrelid = 'gerchain_transaction_witnesses'::regclass
                      AND conname = 'gerchain_witness_event_type_check'
                      AND contype = 'c'
                  """).fetchall()
                  assert len(witness_constraints) == 1, witness_constraints
                  assert witness_constraints[0][1] is True, witness_constraints
                  assert 'GERCHAIN_CREATED' in witness_constraints[0][2], witness_constraints
                  assert all(event in witness_constraints[0][2] for event in (
                      'GERCHAIN_FUNDED', 'GERCHAIN_LOCKED', 'GERCHAIN_RELEASED',
                      'GERCHAIN_REFUNDED', 'GERCHAIN_CANCELLED', 'GERCHAIN_SETTLED'
                  )), witness_constraints
                  preservation_after = connection.execute("""
                    SELECT id, sender_address, receiver_address, amount, state,
                           condition_desc, refund_destination, currency, version,
                           created_at, updated_at
                    FROM escrows WHERE id = 'migration-proof-preserve-001'
                  """).fetchone()
                  assert preservation_after == preservation_before, {
                      "before": preservation_before,
                      "after": preservation_after,
                  }
                  constraints = connection.execute("""
                    SELECT conname, convalidated, pg_get_constraintdef(oid)
                    FROM pg_constraint
                    WHERE conrelid = 'escrows'::regclass
                      AND contype = 'c'
                      AND lower(pg_get_constraintdef(oid)) LIKE '%state%'
                    ORDER BY conname
                  """).fetchall()
                  print(f"PG_CONSTRAINT_ESCROWS={constraints!r}")
                  assert len(constraints) == 1, constraints
                  assert constraints[0][0] == "escrows_state_canonical_check", constraints
                  assert constraints[0][1] is True, constraints
                  assert all(state in constraints[0][2] for state in ("CREATED", "FUNDED", "LOCKED", "RELEASED", "REFUNDED", "CANCELLED")), constraints
                  connection.commit()
                  second = apply_migrations(connection, migration_dir)
                  assert second == (), second
                  print(f"MIGRATION_CHECKSUMS_001_014_PRESERVED={after[:14] == before}")
                  print("MIGRATION_ESCROW_ROW_PRESERVED=PASS")
                  print("MIGRATION_REGISTRY_001_017=PASS")
                  print(f"MIGRATION_017_CHECKSUM={after[16][1]}")
                  print("MIGRATION_017_GERCHAIN_CREATED_CONSTRAINT=PASS")
                  print(f"MIGRATION_015_CHECKSUM={after[14][1]}")
                  print("MIGRATION_015_016_STATE_CONSTRAINT_VALIDATED=PASS")
                  print("MIGRATION_SECOND_RUN_NOOP=PASS")
          print("MIGRATION_BASELINE_001_014_AND_REPAIR_015_016=PASS")
          PY
      - name: Verify canonical fundamental architecture gates (SHUUD excluded)
        run: |
          pytest -q \
            tests/test_core_structure.py \
            tests/test_core_final_lock_contract.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_g3_core_boundary.py \
            tests/test_g3_core_runtime_e2e.py \
            tests/test_g3_dee_authorized_handler.py \
            tests/test_dee_security.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/production/test_runtime_source_compiles.py \
            tests/production/test_postgres_canonical_concurrency.py \
            tests/test_postgres_atomic_ledger.py
      - name: Verify migration contracts and checksum fail-closed behavior
        run: |
          pytest -q tests/postgres/test_migrations.py
          pytest -q -s postgres/tests/test_migration_checksum_atomicity.py
      - name: Re-perform PostgreSQL migration concurrency (canonical runner)
        run: pytest -q -s postgres/tests/test_concurrency.py
      - name: Re-perform PostgreSQL migration concurrency (independent runner)
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_migration_proof
        run: pytest -q -s tests/integration/test_postgres_migration_concurrency.py
      - name: Verify production runtime factory contracts
        run: pytest -q tests/test_production_runtime_factory.py

  production-eai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_reperformance
      GERCHAIN_ESCROW_ID: final-lock-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: MNT
      GERCHAIN_WITNESS_ID: final-lock-witness
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest "psycopg[binary]"
      - name: Record immutable run identity
        run: echo "EXACT_SHA=$(git rev-parse HEAD)"
      - name: Apply canonical migrations and seed only isolated CI escrow
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from services.gerchain_runtime_factory import initialize_canonical_postgres_schema
          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"], pool_pre_ping=True)
          initialize_canonical_postgres_schema(engine)
          with engine.begin() as connection:
              connection.execute(text("""
                INSERT INTO escrows
                  (id, sender_address, receiver_address, amount, state, condition_desc,
                   refund_destination, currency, version, created_at, updated_at)
                VALUES (:id, 'ci-source', 'ci-beneficiary', :amount, 'CREATED',
                        'isolated exact-SHA production gate', 'ci-source', :currency, 0, now(), now())
                ON CONFLICT (id) DO NOTHING
              """), {"id": os.environ["GERCHAIN_ESCROW_ID"],
                     "amount": int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                     "currency": os.environ["GERCHAIN_CURRENCY"]})
          engine.dispose()
          PY
      - name: Create isolated database for production-entrypoint contract tests
        run: |
          PGPASSWORD=gerchain createdb -h 127.0.0.1 -U gerchain gerchain_reperformance
          PGPASSWORD=gerchain psql -h 127.0.0.1 -U gerchain -d gerchain_reperformance -c "SELECT current_database();"
      - name: Verify production entrypoint contract
        run: pytest -q tests/services/test_production_entrypoint.py
      - name: Boot real PostgreSQL runtime and prove canonical authority
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory
          url = os.environ["GERCHAIN_DATABASE_URL"]
          engine = create_engine(url, pool_pre_ping=True)
          runtime = ProductionRuntimeFactory(
            ProductionRuntimeConfig(
              database_url=url,
              escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
              amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
              currency=os.environ["GERCHAIN_CURRENCY"],
              witness_id=os.environ["GERCHAIN_WITNESS_ID"],
            ),
            engine=engine,
          ).create()
          assert runtime.is_canonical_ledger_authoritative
          required = {
            "schema_version", "escrows", "gerchain_ledger_accounts",
            "gerchain_ledger_movements", "gerchain_transaction_witnesses",
            "gerchain_outbox_events", "gerchain_idempotency_records",
          }
          with engine.connect() as connection:
            actual = set(inspect(connection).get_table_names())
          missing = required - actual
          assert not missing, f"missing canonical tables: {sorted(missing)}"
          print("REAL_POSTGRES_BOOT=PASS")
          print("CANONICAL_LEDGER_AUTHORITY=PASS")
          print("CANONICAL_SCHEMA=PASS")
          engine.dispose()
          PY
      - name: Create isolated value-truth database
        run: |
          PGPASSWORD=gerchain createdb -h 127.0.0.1 -U gerchain gerchain_value_truth
      - name: Re-perform deep value-truth graph on real PostgreSQL
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_value_truth
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_value_truth
        run: pytest -q tests/persistence/test_deep_value_reconciliation_postgres.py
      - name: Build exact-SHA evidence manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          root = Path.cwd()
          migrations = sorted((root / "postgres/migrations").glob("*.sql"))
          exact_sha = subprocess.run(
            ["git", "rev-parse", "HEAD"], capture_output=True,
            text=True, check=True
          ).stdout.strip()
          manifest = {
            "repository": os.environ.get("GITHUB_REPOSITORY"),
            "commit_sha": exact_sha,
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "python": platform.python_version(),
            "migration_files": [
              {"path": str(p.relative_to(root)),
               "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
               "bytes": p.stat().st_size}
              for p in migrations
            ],
            "git_status_porcelain": subprocess.run(
              ["git", "status", "--porcelain"], capture_output=True,
              text=True, check=False
            ).stdout.splitlines(),
          }
          out = Path("artifacts/final-eai-core-evidence")
          out.mkdir(parents=True, exist_ok=True)
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          (out / "commit-sha.txt").write_text(manifest["commit_sha"] + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload exact-SHA evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-eai-core-evidence-${{ github.sha }}
          path: artifacts/final-eai-core-evidence/
          if-no-files-found: warn
          retention-days: 90
