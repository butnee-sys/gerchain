name: Production PostgreSQL Re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
      - feat/ea21-transaction-aware-ledger

jobs:
  production-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gerchain -d gerchain_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Production PostgreSQL boot
        run: pytest -q tests/production/test_production_postgres_boot.py

      - name: Deep value truth PostgreSQL re-performance
        run: pytest -q tests/persistence/test_deep_value_reconciliation.py
