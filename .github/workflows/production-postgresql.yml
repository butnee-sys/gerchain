name: Production PostgreSQL Verification

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
      - main
  pull_request:

jobs:
  production-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install pytest "psycopg[binary]"

      - name: Verify production factory and canonical PostgreSQL schema
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
          GERCHAIN_POSTGRES_DSN: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory

          engine = create_engine(os.environ["GERCHAIN_TEST_DATABASE_URL"])
          runtime = ProductionRuntimeFactory(ProductionRuntimeConfig(database_url=os.environ["GERCHAIN_TEST_DATABASE_URL"], escrow_id="ci-escrow", amount=100, currency="MNT", witness_id="ci-witness"), engine=engine).create()
          assert runtime.is_canonical_ledger_authoritative
          assert runtime.runtime_mode == "production-postgresql"
          print("CANONICAL_POSTGRES_RUNTIME_OK")
          engine.dispose()
          PY

      - name: Run canonical persistence tests
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
          GERCHAIN_POSTGRES_DSN: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
        run: |
          python -m pytest --import-mode=importlib -q tests/persistence tests/production/test_production_runtime_postgres_smoke.py tests/integration/test_production_postgresql_boot.py