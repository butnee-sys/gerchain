name: production-postgresql

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:

jobs:
  production-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain
      GERCHAIN_ESCROW_ID: ci-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: MNT
      GERCHAIN_WITNESS_ID: ci-witness

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dee-security.txt

      - name: Production PostgreSQL boot
        run: pytest -q tests/production/test_postgresql_boot.py

      - name: PostgreSQL value-flow integration and re-performance
        run: >-
          pytest -q
          tests/integration/test_ea35_postgres_production.py
          tests/integration/test_ea35_postgres_refund_cancel.py
          tests/integration/test_ea35_postgres_reperformance.py

      - name: Production entrypoint syntax
        run: python -m py_compile production_entrypoint.py services/gerchain_runtime_factory.py
