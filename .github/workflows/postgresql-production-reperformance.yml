name: PostgreSQL production re-performance

on:
  pull_request:
    paths:
      - "persistence/**"
      - "services/**"
      - "postgres/**"
      - "tests/integration/**"
      - "production_entrypoint.py"
      - "requirements-dee-security.txt"
      - ".github/workflows/postgresql-production-reperformance.yml"

jobs:
  production-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain
          POSTGRES_USER: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:postgres@127.0.0.1:5432/gerchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install production dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: Production PostgreSQL re-performance
        run: pytest -q tests/integration/test_production_postgresql_reperformance.py
