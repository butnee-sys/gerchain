name: CORE Operating Reconciliation

on:
  push:
    branches: ["feat/canonical-protection-architecture"]
  pull_request:
  workflow_dispatch:

jobs:
  core-reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r postgres/requirements-test.txt
          pip install "sqlalchemy>=2" "psycopg[binary]" pytest
      - name: Run operating reconciliation integration suite
        run: python -m pytest -q tests/test_operating_reconciliation.py
