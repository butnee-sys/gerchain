name: production-postgresql-gate

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  postgresql-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gerchain -d gerchain"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain
      GERCHAIN_ESCROW_ID: pg-smoke-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: MNT
      GERCHAIN_WITNESS_ID: pg-smoke-witness

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install production dependencies
        run: python -m pip install -r requirements-dee-security.txt pytest
      - name: PostgreSQL production value-truth gate
        run: pytest -q tests/production/test_postgresql_production_value_truth.py
