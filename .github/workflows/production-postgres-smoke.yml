name: Production PostgreSQL Smoke

on:
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]
  pull_request:
    branches: ["main"]

jobs:
  production-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install production dependencies
        run: python -m pip install -r requirements-dee-security.txt pytest
      - name: Verify production runtime boot and canonical schema
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_ESCROW_ID: smoke-escrow
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: MNT
          GERCHAIN_WITNESS_ID: smoke-witness
        run: |
          python - <<'PY'
          import os
          from services.gerchain_runtime_factory import (
              ProductionRuntimeConfig,
              ProductionRuntimeFactory,
          )

          config = ProductionRuntimeConfig(
              database_url=os.environ["GERCHAIN_DATABASE_URL"],
              escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
              amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
              currency=os.environ["GERCHAIN_CURRENCY"],
              witness_id=os.environ["GERCHAIN_WITNESS_ID"],
          )
          factory = ProductionRuntimeFactory(config)
          runtime = factory.create()

          assert runtime.is_canonical_ledger_authoritative
          assert runtime.runtime_mode == "production-postgresql"

          with factory.engine.connect() as connection:
              tables = set(__import__("sqlalchemy").inspect(connection).get_table_names())

          required = {
              "escrows",
              "gerchain_ledger_accounts",
              "gerchain_ledger_movements",
              "gerchain_transaction_witnesses",
              "gerchain_outbox_events",
              "gerchain_idempotency_records",
              "schema_version",
          }
          missing = required - tables
          assert not missing, f"missing canonical production tables: {sorted(missing)}"

          print("PRODUCTION_POSTGRES_SMOKE_OK")
          factory.engine.dispose()
          PY

      - name: Execute production EAI value flow
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q tests/integration/test_production_postgres_eai.py
