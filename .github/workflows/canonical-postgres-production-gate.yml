name: Canonical PostgreSQL Production Gate

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-postgres-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain_test
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dee-security.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt pytest
      - name: Verify production entrypoint and factory contracts
        run: |
          pytest -q tests/services/test_production_entrypoint.py tests/services/test_gerchain_runtime_factory.py
      - name: Run versioned migrations and boot against real PostgreSQL
        run: |
          pytest -q tests/integration/test_canonical_postgres_production_gate.py
