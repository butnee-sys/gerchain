name: production-postgres-evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-production-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain
      GERCHAIN_ESCROW_ID: smoke-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: USD
      GERCHAIN_WITNESS_ID: smoke-witness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install pytest
      - name: Production factory boot
        run: |
          python - <<'PY'
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory
          import os
          cfg = ProductionRuntimeConfig(
              database_url=os.environ["GERCHAIN_DATABASE_URL"],
              escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
              amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
              currency=os.environ["GERCHAIN_CURRENCY"],
              witness_id=os.environ["GERCHAIN_WITNESS_ID"],
          )
          runtime = ProductionRuntimeFactory(cfg).create()
          assert runtime.is_canonical_ledger_authoritative
          print("CANONICAL_PRODUCTION_BOOT=PASS")
          PY
      - name: Deep reconciliation tests
        run: pytest -q tests/persistence/test_deep_value_reconciliation.py
