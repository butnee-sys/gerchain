name: PostgreSQL Concurrency

on:
  push:
    branches: ["postgres-concurrency-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install -r requirements-dee-security.txt
          python -m pip install -r postgres/requirements-test.txt
      - name: Run PostgreSQL concurrency suite
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q postgres/tests/test_concurrency.py
      - name: Run production runtime PostgreSQL boot gate
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q tests/postgres/test_production_runtime_boot.py
