name: PostgreSQL Concurrency

on:
  push:
    branches: ["postgres-concurrency-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -r postgres/requirements-test.txt
      - name: Run PostgreSQL concurrency suite
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q postgres/tests/test_concurrency.py
      - name: Export migration and constraint evidence
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python postgres/tests/export_migration_evidence.py
      - name: Upload PostgreSQL evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: postgres-evidence-${{ github.sha }}-${{ github.run_id }}
          path: postgres-evidence/
          if-no-files-found: error
          retention-days: 90
