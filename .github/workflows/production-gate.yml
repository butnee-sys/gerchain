name: Production Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain_test
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gerchain:gerchain_test@127.0.0.1:5432/gerchain_test
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain_test@127.0.0.1:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain_test@127.0.0.1:5432/gerchain_test
      GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain_test@127.0.0.1:5432/gerchain_test
      GERCHAIN_MIGRATION_TEST_DATABASE_URL: postgresql://gerchain:gerchain_test@127.0.0.1:5432/gerchain_test
      PYTHONPYCACHEPREFIX: /tmp/gerchain-pycache
      CANONICAL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || '' }}
      GITHUB_EVENT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify canonical evidence commit SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$CANONICAL_COMMIT_SHA"
          if [ -n "$PR_HEAD_COMMIT_SHA" ]; then test "$checked_out_sha" = "$PR_HEAD_COMMIT_SHA"; fi
          echo "CANONICAL_COMMIT_SHA=$CANONICAL_COMMIT_SHA"
          echo "CHECKED_OUT_HEAD_SHA=$checked_out_sha"
          echo "GITHUB_EVENT_COMMIT_SHA=$GITHUB_EVENT_COMMIT_SHA"
          echo "PR_HEAD_COMMIT_SHA=$PR_HEAD_COMMIT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install -r requirements-dee-security.txt
          if [ -f postgres/requirements-test.txt ]; then python -m pip install -r postgres/requirements-test.txt; fi
          python -m pip install pytest "psycopg[binary]" "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "python-multipart>=0.0.9"

      - name: Apply canonical PostgreSQL migrations before database-backed tests
        run: |
          python - <<'PY'
          import os
          import psycopg
          from postgres.migrations import apply_migrations
          with psycopg.connect(os.environ['GERCHAIN_MIGRATION_TEST_DATABASE_URL']) as conn:
              applied = apply_migrations(conn, 'postgres/migrations')
              rows = conn.execute('SELECT version, checksum FROM schema_version ORDER BY version').fetchall()
              expected = list(range(1, 18))
              if [row[0] for row in rows] != expected:
                  raise SystemExit(f'FAIL: expected migration versions 1..17, got {[row[0] for row in rows]}')
              if len(applied) not in (0, 17):
                  raise SystemExit(f'FAIL: unexpected migration application result: {applied!r}')
              print(f'PRODUCTION_GATE_MIGRATIONS=PASS versions={len(rows)} newly_applied={len(applied)}')
          PY
      - name: Run Production Gate Tests with Detailed Log
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/production-gate
          failures=0
          reset_public_schema() {
            python - <<'PY'
          import os
          import psycopg

          dsn = os.environ["GERCHAIN_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute("DROP SCHEMA public CASCADE")
              connection.execute("CREATE SCHEMA public")
              connection.execute("GRANT ALL ON SCHEMA public TO gerchain")
              connection.execute("GRANT ALL ON SCHEMA public TO PUBLIC")
          PY
          }
          mapfile -t all_test_files < <(find tests postgres/tests -type f -name 'test_*.py' | sort)
          test_files=()
          excluded_product_tests=()
          for test_file in "${all_test_files[@]}"; do
            case "$test_file" in
              */test_shuud_*.py|*/test_sandbox_*.py)
                excluded_product_tests+=("$test_file")
                ;;
              *)
                test_files+=("$test_file")
                ;;
            esac
          done
          printf '%s\n' "${excluded_product_tests[@]}" > artifacts/production-gate/product-tests-out-of-eai-scope.txt
          printf '%s\n' "SHUUD and SANDBOX product tests are evaluated in the isolated product workflow, not as EAI acceptance criteria." > artifacts/production-gate/scope-disposition.txt
          echo "SHUUD_AND_SANDBOX_PRODUCT_TESTS_OUT_OF_EAI_SCOPE=${#excluded_product_tests[@]}"
          for test_file in "${test_files[@]}"; do
            file_stem="${test_file//\//__}"
            log="artifacts/production-gate/${file_stem}.log"
            junit="artifacts/production-gate/${file_stem}.junit.xml"
            echo "=== PRODUCTION GATE FILE: $test_file ==="
            reset_public_schema
            reset_rc=$?
            if [ "$reset_rc" -ne 0 ]; then
              echo "DATABASE_RESET_FAILED=$test_file" | tee "$log"
              failures=$((failures + 1))
              continue
            fi
            PYTHONFAULTHANDLER=1 python -X faulthandler -m pytest --import-mode=importlib --disable-warnings -v --junitxml="$junit" "$test_file" >"$log" 2>&1
            rc=$?
            echo "FILE_RESULT=$test_file EXIT_CODE=$rc" | tee -a "$log"
            tail -n 8 "$log"
            if [ "$rc" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "PRODUCTION_GATE_FILE_FAILURE_COUNT=$failures"
          if [ "$failures" -ne 0 ]; then exit 1; fi
      - name: Build canonical Production Gate evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-gate
          python - <<'PY'
          import hashlib, json, os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path("artifacts/production-gate")
          canonical = os.environ["CANONICAL_COMMIT_SHA"]
          checked_out = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tracked = subprocess.check_output(["git", "ls-files", "-z"], text=False).split(bytes([0]))
          hashes = []
          source_candidates = [raw for raw in tracked if raw and Path(raw.decode()).suffix in {".py", ".sql", ".yml", ".yaml", ".toml", ".json"}]
          missing_sources = []
          for raw in source_candidates:
              if not raw: continue
              path = Path(raw.decode())
              if path.is_file():
                  hashes.append({"path": path.as_posix(), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
              else:
                  missing_sources.append(path.as_posix())
          junit = sorted(p.as_posix() for p in root.rglob("*.junit.xml"))
          logs = sorted(p.as_posix() for p in root.rglob("*.log"))
          test_counts = {"failures": 0, "errors": 0, "skipped": 0, "suites": 0}
          for name in junit:
              suite = ET.parse(name).getroot()
              suites = list(suite.iter("testsuite")) if suite.tag != "testsuite" else [suite]
              for item in suites:
                  test_counts["suites"] += 1
                  for key in ("failures", "errors", "skipped"):
                      test_counts[key] += int(item.attrib.get(key, "0"))
          manifest = {
              "evidence_status": "PASS_CANDIDATE" if canonical == checked_out and junit and test_counts["failures"] == 0 and test_counts["errors"] == 0 and not missing_sources else "INCOMPLETE_OR_FAILED",
              "canonical_commit_sha": canonical, "commit_sha": canonical,
              "checked_out_head_sha": checked_out,
              "github_event_sha": os.environ.get("GITHUB_EVENT_COMMIT_SHA"),
              "pull_request_head_sha": os.environ.get("PR_HEAD_COMMIT_SHA") or None,
              "run_id": os.environ.get("GITHUB_RUN_ID"), "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "source_hashes_complete": len(hashes) == len(source_candidates) and not missing_sources, "source_file_count": len(hashes), "source_hashes": hashes, "missing_source_files": missing_sources, "junit_totals": test_counts,
              "junit_files": junit, "log_files": logs,
          }
          (root / "canonical-evidence-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + chr(10), encoding="utf-8")
          print(json.dumps({k:v for k,v in manifest.items() if k != "source_hashes"}, indent=2))
          assert canonical == checked_out, "canonical commit SHA mismatch"
          PY
      - name: Upload per-file Production Gate logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-per-file-logs-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/production-gate/
          if-no-files-found: warn
          retention-days: 90
