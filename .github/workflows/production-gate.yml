name: Production Gate

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify approved evidence lineage and immutable source artifacts
        id: lineage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_SHA: 89d698b1f6cac407f83df2830209773f52eabc18
          POSTGRES_RUN_ID: "42196184243"
          POSTGRES_ATTEMPT: "1"
          POSTGRES_ARTIFACT_ID: "13491983619"
          POSTGRES_ARTIFACT_DIGEST: "sha256:d3e2ab98e99790fecc964b78ffefa72af8fde5561fb454662243c2727756d683"
          AUDIT_RUN_ID: "42196184415"
          AUDIT_ATTEMPT: "1"
          AUDIT_ARTIFACT_ID: "13492437402"
          AUDIT_ARTIFACT_DIGEST: "sha256:1a0fb0d3a2d71bd4effa8c5af940cc41eea219cafe1b71b0d5a4bd9abb2f2193"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          mapfile -t changed < <(git diff --name-only --no-renames "$SOURCE_SHA" "$CANDIDATE_SHA" | sort)
          expected=(
            ".github/workflows/core-gates.yml"
            ".github/workflows/production-gate.yml"
            ".github/workflows/production-master-gate.yml"
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            printf 'Unexpected changed-file inventory:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git diff --check "$SOURCE_SHA" "$CANDIDATE_SHA"

          postgres_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$POSTGRES_RUN_ID")
          audit_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AUDIT_RUN_ID")
          test "$(jq -r .head_sha <<<"$postgres_run")" = "$SOURCE_SHA"
          test "$(jq -r .head_sha <<<"$audit_run")" = "$SOURCE_SHA"
          test "$(jq -r .run_attempt <<<"$postgres_run")" = "$POSTGRES_ATTEMPT"
          test "$(jq -r .run_attempt <<<"$audit_run")" = "$AUDIT_ATTEMPT"
          test "$(jq -r .conclusion <<<"$postgres_run")" = "success"
          test "$(jq -r .conclusion <<<"$audit_run")" = "success"

          postgres_artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$POSTGRES_RUN_ID/artifacts?per_page=100")
          audit_artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AUDIT_RUN_ID/artifacts?per_page=100")
          test "$(jq -r --argjson id "$POSTGRES_ARTIFACT_ID" '.artifacts[] | select(.id == $id) | .digest' <<<"$postgres_artifacts")" = "$POSTGRES_ARTIFACT_DIGEST"
          test "$(jq -r --argjson id "$AUDIT_ARTIFACT_ID" '.artifacts[] | select(.id == $id) | .digest' <<<"$audit_artifacts")" = "$AUDIT_ARTIFACT_DIGEST"
          test "$(jq -r --argjson id "$POSTGRES_ARTIFACT_ID" '.artifacts[] | select(.id == $id) | .expired' <<<"$postgres_artifacts")" = "false"
          test "$(jq -r --argjson id "$AUDIT_ARTIFACT_ID" '.artifacts[] | select(.id == $id) | .expired' <<<"$audit_artifacts")" = "false"

          mkdir -p evidence-source/postgres evidence-source/audit
          gh run download "$POSTGRES_RUN_ID" --name "ea35-$SOURCE_SHA-$POSTGRES_RUN_ID-$POSTGRES_ATTEMPT" --dir evidence-source/postgres
          gh run download "$AUDIT_RUN_ID" --name "eai-production-audit-76e07a5d2dbf2e27b8f1e936fec2340799f26201-$AUDIT_RUN_ID" --dir evidence-source/audit

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def verify_index(root: Path, detached: bool):
              sums = root / "SHA256SUMS"
              if not sums.is_file():
                  raise SystemExit(f"missing SHA256SUMS: {root}")
              if detached:
                  line = (root / "MANIFEST.SHA256").read_text().strip().split("  ", 1)
                  if len(line) != 2 or line[1] != "SHA256SUMS":
                      raise SystemExit("invalid detached manifest format")
                  if hashlib.sha256(sums.read_bytes()).hexdigest() != line[0]:
                      raise SystemExit("detached checksum mismatch")
              entries = {}
              for line in sums.read_text().splitlines():
                  digest, name = line.split("  ", 1)
                  path = Path(name)
                  if path.is_absolute() or ".." in path.parts or name in entries:
                      raise SystemExit("unsafe or duplicate checksum entry")
                  target = root / path
                  if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() != digest:
                      raise SystemExit(f"evidence checksum mismatch: {name}")
                  entries[name] = digest
              if not entries:
                  raise SystemExit("empty evidence checksum index")
              return entries

          pg = Path("evidence-source/postgres")
          audit = Path("evidence-source/audit")
          pg_entries = verify_index(pg, True)
          audit_entries = verify_index(audit, False)
          required_pg = {"manifest.json", "postgres-gates.json", "architecture-gates.json"}
          if not required_pg.issubset(pg_entries):
              raise SystemExit(f"PostgreSQL evidence inventory incomplete: {sorted(required_pg - set(pg_entries))}")
          required_audit = {
              "audit-metadata.txt", "audit-verdict.md", "postgres-preflight.txt",
              "pytest-collect.log", "pytest-eai.log",
          }
          if set(audit_entries) != required_audit:
              raise SystemExit("independent audit evidence inventory mismatch")
          metadata = {}
          for line in (audit / "audit-metadata.txt").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  metadata[k] = v
          source_sha = os.environ["SOURCE_SHA"]
          if metadata.get("commit_sha") != source_sha:
              raise SystemExit("independent audit source SHA mismatch")
          if metadata.get("run_id") != os.environ["AUDIT_RUN_ID"] or metadata.get("attempt") != os.environ["AUDIT_ATTEMPT"]:
              raise SystemExit("independent audit run identity mismatch")
          verdict = (audit / "audit-verdict.md").read_text()
          preflight = (audit / "postgres-preflight.txt").read_text()
          collect = (audit / "pytest-collect.log").read_text()
          tests = (audit / "pytest-eai.log").read_text()
          import re
          collected = re.search(r"(\d+) tests? collected", collect)
          passed = re.search(r"(\d+) passed(?: in [^\n]+)?", tests)
          if "Collection: success" not in verdict or "EAI tests: success" not in verdict:
              raise SystemExit("independent audit verdict is not PASS")
          if "server_version: 16" not in preflight or not collected or not passed:
              raise SystemExit("independent audit runtime/pytest evidence incomplete")
          if int(collected.group(1)) <= 0 or int(collected.group(1)) != int(passed.group(1)):
              raise SystemExit("independent audit collected/passed counts differ")
          if "failed" in tests.lower() or "skipped" in tests.lower():
              raise SystemExit("independent audit contains failed or skipped tests")
          lineage = {
              "schema_version": "1.0",
              "policy": "FAIL_CLOSED",
              "source_sha": source_sha,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "allowed_changed_files": [
                  ".github/workflows/core-gates.yml",
                  ".github/workflows/production-gate.yml",
                  ".github/workflows/production-master-gate.yml",
              ],
              "changed_files": sorted(__import__("subprocess").check_output(
                  ["git", "diff", "--name-only", "--no-renames", source_sha, os.environ["CANDIDATE_SHA"]],
                  text=True
              ).splitlines()),
              "source_evidence": {
                  "postgres": {
                      "run_id": int(os.environ["POSTGRES_RUN_ID"]),
                      "run_attempt": int(os.environ["POSTGRES_ATTEMPT"]),
                      "artifact_id": int(os.environ["POSTGRES_ARTIFACT_ID"]),
                      "artifact_digest": os.environ["POSTGRES_ARTIFACT_DIGEST"],
                      "file_checksums": pg_entries,
                  },
                  "independent_audit": {
                      "run_id": int(os.environ["AUDIT_RUN_ID"]),
                      "run_attempt": int(os.environ["AUDIT_ATTEMPT"]),
                      "artifact_id": int(os.environ["AUDIT_ARTIFACT_ID"]),
                      "artifact_digest": os.environ["AUDIT_ARTIFACT_DIGEST"],
                      "file_checksums": audit_entries,
                  },
              },
              "scope_validation": "PASS",
              "artifact_validation": "PASS",
              "independent_audit_validation": "PASS",
          }
          lineage["changed_files_sha256"] = hashlib.sha256(
              ("\n".join(lineage["changed_files"]) + "\n").encode()
          ).hexdigest()
          Path("production-evidence").mkdir(exist_ok=True)
          Path("production-evidence/evidence-lineage.json").write_text(
              json.dumps(lineage, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(lineage, indent=2, sort_keys=True))
          PY

      - name: Generate evidence checksums
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("production-evidence")
          files = sorted(p for p in root.rglob("*") if p.is_file() and p.name not in {"SHA256SUMS", "MANIFEST.SHA256"})
          if not files:
              raise SystemExit("no production evidence generated")
          sums = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          (root / "SHA256SUMS").write_text(sums)
          digest = hashlib.sha256((root / "SHA256SUMS").read_bytes()).hexdigest()
          (root / "MANIFEST.SHA256").write_text(f"{digest}  SHA256SUMS\n")
          for line in sums.splitlines():
              expected, name = line.split("  ", 1)
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f"checksum mismatch: {name}")
          PY

      - name: Upload verified evidence lineage
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-evidence
          path: production-evidence/
          if-no-files-found: error
          retention-days: 90
