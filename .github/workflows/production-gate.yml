name: Production Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install -r requirements-dee-security.txt
          python -m pip install pytest "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "python-multipart>=0.0.9"

      - name: Run Production Gate Tests with Detailed Log
        run: |
          python -m pytest --import-mode=importlib --maxfail=1 --disable-warnings -v
