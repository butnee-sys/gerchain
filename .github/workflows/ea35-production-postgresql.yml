name: EA-35 Production PostgreSQL Evidence

on:
  push:
    branches: ["feat/ea35-production-lock-candidate"]
  pull_request:
    branches: ["main"]

jobs:
  production-postgresql-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r postgres/requirements-test.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements-dee-security.txt
      - name: Run deep value truth reconciliation on PostgreSQL
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: >-
          python -m pytest -q
          tests/persistence/test_deep_value_reconciliation.py
          --junitxml=artifacts/ea35-postgres-deep-reconciliation.xml
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea35-postgres-deep-reconciliation
          path: artifacts/ea35-postgres-deep-reconciliation.xml
          if-no-files-found: error
