name: production-postgres-gate

on:
  push:
    branches:
      - "feat/ea21-transaction-aware-ledger"
  workflow_dispatch:

jobs:
  postgres-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements-dee-security.txt pytest
      - name: Run production PostgreSQL gate
        run: pytest -q tests/integration/test_production_postgres_gate.py
