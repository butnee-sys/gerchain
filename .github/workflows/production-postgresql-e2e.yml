name: production-postgresql-e2e

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt
          pip install pytest

      - name: Run production PostgreSQL E2E
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
        run: |
          pytest -q tests/production/test_postgresql_runtime_e2e.py tests/persistence/test_deep_value_reconciliation.py
