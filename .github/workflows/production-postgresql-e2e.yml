name: production-postgresql-e2e

on:
  push:
    branches:
      - ea35-production-proof-final
  pull_request:

jobs:
  production-postgresql-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain
      GERCHAIN_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: Run production runtime boot and re-performance
        run: pytest -q tests/postgres/test_production_runtime_boot.py tests/postgres/test_production_postgres_reperformance.py
