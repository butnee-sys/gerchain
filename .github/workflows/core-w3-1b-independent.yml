name: CORE W3.1-B Independent Assurance

on:
  push:
    branches: ["feat/core-w3-1-ddl-authority"]
  pull_request:

jobs:
  w3-1b-independent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]" "sqlalchemy>=2" pytest
      - name: Run migration identity and executor tests
        run: |
          pytest -q \
            tests/test_migration_identity.py \
            tests/test_migration_executor.py \
            tests/test_postgres_migration_executor.py \
            tests/test_postgres_migration_executor_recovery.py
      - name: Run independent migration oracle
        run: python tests/independent/w3_1b_independent_oracle.py
      - name: Run independent PostgreSQL re-performance
        run: python tests/independent/w3_1b_postgres_reperformance.py
