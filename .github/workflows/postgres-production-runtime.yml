name: PostgreSQL Production Runtime

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/ea35-production-lock-candidate"]

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -r postgres/requirements-test.txt
      - name: Verify canonical production runtime boot
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q --junitxml=artifacts/postgres-production-runtime.xml postgres/tests/test_production_runtime_boot.py
      - name: Upload PostgreSQL production runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-production-runtime-junit
          path: artifacts/postgres-production-runtime.xml
          if-no-files-found: error
