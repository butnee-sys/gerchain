name: Production PostgreSQL Runtime Verification

on:
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]
  workflow_dispatch:

jobs:
  production-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_prod_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_prod_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-dee-security.txt
      - name: Verify production factory and canonical schema
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_prod_verify
          GERCHAIN_ESCROW_ID: production-verify-escrow
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: USD
          GERCHAIN_WITNESS_ID: production-verify-witness
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from services.gerchain_runtime_factory import ProductionRuntimeFactory

          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"], pool_pre_ping=True)
          from services.gerchain_runtime_factory import ProductionRuntimeConfig
          factory = ProductionRuntimeFactory(
              ProductionRuntimeConfig(
                  database_url=os.environ["GERCHAIN_DATABASE_URL"],
                  escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
                  amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                  currency=os.environ["GERCHAIN_CURRENCY"],
                  witness_id=os.environ["GERCHAIN_WITNESS_ID"],
              ),
              engine=engine,
          )
          runtime = factory.create()
          assert runtime.is_canonical_ledger_authoritative
          required = {
              "escrows", "gerchain_ledger_accounts", "gerchain_ledger_movements",
              "gerchain_transaction_witnesses", "gerchain_outbox_events",
              "gerchain_idempotency_records",
          }
          tables = set(inspect(engine).get_table_names())
          assert required <= tables, (required - tables)
          print("PRODUCTION_POSTGRES_BOOT=PASS")
          print("CANONICAL_LEDGER_AUTHORITY=PASS")
          print("CANONICAL_SCHEMA_TABLES=PASS")
          engine.dispose()
          PY
