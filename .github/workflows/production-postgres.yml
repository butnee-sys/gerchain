name: production-postgres

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
      - main
  pull_request:

jobs:
  postgres-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
      TEST_POSTGRES_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: Verify production PostgreSQL migration and boot
        run: |
          pytest -q tests/integration/test_production_postgres_boot.py
      - name: Verify production PostgreSQL value flow
        run: |
          pytest -q tests/integration/test_postgresql_production_gate.py
      - name: Verify deep value truth suite
        run: |
          pytest -q tests/persistence/test_deep_value_reconciliation.py
