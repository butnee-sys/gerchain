name: core-gates

on:
  push:
    branches: ["feat/de-dee-gate01", "feat/gerchain-flow-hardening", "feat/core-gate02-capability-audit", "feat/ea21-transaction-aware-ledger", "main"]
  pull_request:

jobs:
  core-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dee-security.txt ]; then pip install -r requirements-dee-security.txt; fi
          if [ -f postgres/requirements-test.txt ]; then pip install -r postgres/requirements-test.txt; fi
          pip install "sqlalchemy>=2" "psycopg[binary]" fastapi uvicorn httpx pytest
      - name: Run canonical fundamental architecture gate
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: |
          pytest -q \
            tests/test_core_structure.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_g3_core_boundary.py \
            tests/test_g3_core_runtime_e2e.py \
            tests/test_g3_dee_authorized_handler.py \
            tests/test_dee_security.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/test_postgres_atomic_ledger.py \
            tests/test_production_runtime_factory.py \
            tests/test_production_runtime_factory_postgres.py \
            tests/production/test_postgres_canonical_runtime.py \
            tests/production/test_postgres_runtime_boot.py \
            tests/production/test_production_runtime_postgres_smoke.py \
            tests/persistence/test_deep_value_reconciliation.py
