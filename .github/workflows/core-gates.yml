name: core-gates

# SINGLE AUTHORITATIVE FUNDAMENTAL/CORE GATE
# PostgreSQL concurrency is a sub-gate here; no parallel PostgreSQL concurrency workflow exists.
# This gate intentionally excludes legacy/product-only workflows and tests that assert superseded authorities.

concurrency:
  group: core-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/ea35-production-lock-candidate", "main"]
  workflow_dispatch:

jobs:
  core-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_ESCROW_ID: core-gate-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: USD
      GERCHAIN_WITNESS_ID: core-gate-witness

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dee-security.txt ]; then pip install -r requirements-dee-security.txt; fi
          if [ -f postgres/requirements-test.txt ]; then pip install -r postgres/requirements-test.txt; fi
          pip install "sqlalchemy>=2" "psycopg[binary]" fastapi uvicorn httpx pytest pyyaml

      - name: Validate workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yml"):
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          print("WORKFLOW_YAML=PASS")
          PY

      - name: Validate canonical test manifest
        run: |
          set -euo pipefail
          tests=(
            tests/test_core_structure.py
            tests/test_production_runtime_factory.py
            tests/test_production_runtime_factory_postgres.py
            tests/test_boundary_adapters.py
            tests/test_composition_root.py
            tests/test_governed_flow_adapters.py
            tests/test_g3_core_boundary.py
            tests/test_g3_core_runtime_e2e.py
            tests/test_g3_dee_authorized_handler.py
            tests/test_dee_security.py
            tests/test_nef_gerchain_boundary.py
            tests/test_nef_gerchain_port.py
            tests/test_gerchain_runtime.py
            tests/test_gerchain_capability_ownership.py
            tests/test_postgres_atomic_ledger.py
            tests/test_postgresql_runtime_authority.py
            tests/persistence/test_deep_value_reconciliation.py
            postgres/tests/test_concurrency.py
          )
          for test in "${tests[@]}"; do
            test -f "$test"
          done
          echo "TEST_MANIFEST=PASS"

      - name: Verify source compiles
        run: python -m compileall -q services production_entrypoint.py persistence postgres

      - name: Fundamental architecture gate
        run: |
          pytest -q \
            tests/test_core_structure.py \
            tests/test_production_runtime_factory.py \
            tests/test_production_runtime_factory_postgres.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_g3_core_boundary.py \
            tests/test_g3_core_runtime_e2e.py \
            tests/test_g3_dee_authorized_handler.py \
            tests/test_dee_security.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/test_gerchain_runtime.py \
            tests/test_gerchain_capability_ownership.py \
            tests/test_postgres_atomic_ledger.py \
            tests/test_postgresql_runtime_authority.py \
            tests/persistence/test_deep_value_reconciliation.py

      - name: PostgreSQL concurrency gate
        run: pytest -q postgres/tests/test_concurrency.py

      - name: Production runtime boot gate
        run: |
          set +e
          timeout --signal=TERM 8s python production_entrypoint.py > production-entrypoint.log 2>&1
          rc=$?
          cat production-entrypoint.log
          if [ "$rc" -ne 124 ]; then
            echo "expected controlled timeout after successful production boot, got rc=$rc"
            exit 1
          fi
          grep -q "GerChain production runtime initialized" production-entrypoint.log
