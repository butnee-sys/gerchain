name: core-gates
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Preserve long-running evidence collection; a newer queued request must not cancel it.
  cancel-in-progress: false

# Production PostgreSQL evidence gate: EA-35.27 exact-branch re-performance
# EA-35.47: exact-SHA final production evidence gate after runtime/migration fixes.
# Single authoritative PostgreSQL/core gate; duplicate migration/concurrency workflows are not permitted

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ea21-transaction-aware-ledger]

jobs:
  core-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      GERCHAIN_TEST_POSTGRES_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dee-security.txt ]; then pip install -r requirements-dee-security.txt; fi
          if [ -f postgres/requirements-test.txt ]; then pip install -r postgres/requirements-test.txt; fi
          pip install "sqlalchemy>=2" "psycopg[binary]" fastapi uvicorn httpx pytest pyyaml "cryptography>=43,<47"
          python -c "import cryptography; print('CRYPTOGRAPHY_VERSION=' + cryptography.__version__)"
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yml"):
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          print("WORKFLOW_YAML=PASS")
          PY
      - name: Verify production runtime source compiles
        run: python -m compileall -q services production_entrypoint.py persistence postgres
      - name: Run PostgreSQL migration publication concurrency regression
        run: pytest -q tests/postgres/test_migration_concurrency.py
      - name: Run canonical fundamental architecture gate (SHUUD excluded)
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_POSTGRES_DSN: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: |
          pytest -q \
            tests/test_core_structure.py \
            tests/test_core_final_lock_contract.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_g3_core_boundary.py \
            tests/test_g3_core_runtime_e2e.py \
            tests/test_g3_dee_authorized_handler.py \
            tests/test_dee_security.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/production/test_runtime_source_compiles.py \
            tests/production/test_postgres_canonical_concurrency.py \
            tests/test_postgres_atomic_ledger.py \
            tests/test_production_runtime_factory.py \
            tests/production/test_production_runtime_factory_postgres.py \
            tests/production/test_postgres_ten_movement_evidence.py \
            tests/production/test_production_entrypoint.py \
            tests/persistence/test_deep_value_reconciliation.py \
            tests/services/test_gerchain_runtime_fund_canonical.py \
            tests/services/test_gerchain_runtime_refund_canonical.py \
            tests/services/test_gerchain_runtime_cancel_canonical.py \
            tests/services/test_gerchain_runtime_settlement_canonical.py
      - name: Run full EAI test suite on the same commit (SHUUD and SANDBOX product tests excluded)
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_TEST_POSTGRES_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/eai-scope
          mapfile -t excluded_product_tests < <(find tests -type f \( -name 'test_shuud_*.py' -o -name 'test_sandbox_*.py' \) | sort)
          printf '%s\\n' "${excluded_product_tests[@]}" > artifacts/eai-scope/product-tests-out-of-eai-scope.txt
          printf '%s\\n' "SHUUD and SANDBOX are separate product MVPs; their product tests are not EAI acceptance criteria." > artifacts/eai-scope/scope-disposition.txt
          echo "SHUUD_AND_SANDBOX_PRODUCT_TESTS_OUT_OF_EAI_SCOPE=${#excluded_product_tests[@]}"
          ignore_args=()
          for test_file in "${excluded_product_tests[@]}"; do
            ignore_args+=(--ignore="$test_file")
          done
          pytest -q --import-mode=importlib --junitxml=artifacts/eai-scope/eai-regression.junit.xml "${ignore_args[@]}"
      - name: Upload EAI scope and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eai-scope-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/eai-scope/
          if-no-files-found: warn
          retention-days: 90
      - name: Audit canonical migration inventory and applied history
        if: always()
        env:
          GERCHAIN_MIGRATION_AUDIT_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          REQUIRE_MIGRATION_HISTORY: "1"
          MIGRATION_INVENTORY_REPORT: artifacts/canonical-postgres-evidence/migration-gate-report.json
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          mkdir -p artifacts/canonical-postgres-evidence
          python scripts/audit_migration_inventory.py
          audit_rc=$?
          report="artifacts/canonical-postgres-evidence/migration-gate-report.json"
          if [ ! -s "$report" ]; then
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          report = Path("artifacts/canonical-postgres-evidence/migration-gate-report.json")
          requested_sha = os.environ.get("TARGET_SHA", "UNKNOWN")
          checked_out_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report.write_text(json.dumps({
              "status": "FAIL",
              "evidence_status": "INCOMPLETE_OR_FAILED",
              "commit_sha": checked_out_sha,
              "checked_out_head_sha": checked_out_sha,
              "requested_head_sha": requested_sha,
              "github_event_sha": os.environ.get("GITHUB_SHA", "UNKNOWN"),
              "sha_match": requested_sha == checked_out_sha,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "failure": "Migration inventory audit did not produce its report; inspect the preceding audit step logs.",
          }, indent=2, sort_keys=True), encoding="utf-8")
          PY
          fi
          echo "MIGRATION_AUDIT_EXIT_CODE=$audit_rc"
          test -s "$report"
          exit "$audit_rc"
      - name: Upload migration inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-gate-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/canonical-postgres-evidence/
          if-no-files-found: error
          retention-days: 90
