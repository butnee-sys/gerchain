name: EAI PostgreSQL Re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gerchain_ci
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain_ci_password@localhost:5432/gerchain_ci
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Record tested revision and PostgreSQL version
        run: |
          mkdir -p evidence/postgres
          git rev-parse HEAD | tee evidence/postgres/commit.txt
          python --version 2>&1 | tee evidence/postgres/python-version.txt
          psql "$GERCHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT version();' | tee evidence/postgres/postgres-version.txt
      - name: Apply checked-in SQL migration
        run: |
          psql "$GERCHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f postgres/schema/001_concurrency.sql 2>&1 | tee evidence/postgres/migration.log
          psql "$GERCHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT version, checksum, applied_at FROM schema_version ORDER BY version;' 2>&1 | tee evidence/postgres/migration-history.txt
      - name: Verify canonical production runtime construction against PostgreSQL
        run: |
          python - <<'PY' 2>&1 | tee evidence/postgres/runtime-boot.log
          import os
          from sqlalchemy import create_engine, inspect
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory

          url = os.environ["GERCHAIN_DATABASE_URL"]
          engine = create_engine(url, pool_pre_ping=True)
          try:
              assert engine.dialect.name == "postgresql"
              factory = ProductionRuntimeFactory(
                  ProductionRuntimeConfig(
                      database_url=url,
                      escrow_id="ci-escrow",
                      amount=1,
                      currency="MNT",
                      witness_id="ci-witness",
                  ),
                  engine=engine,
              )
              runtime = factory.create()
              assert runtime.is_canonical_ledger_authoritative
              inspector = inspect(engine)
              required = {
                  "gerchain_ledger_accounts",
                  "gerchain_ledger_movements",
                  "escrows",
                  "transaction_witnesses",
                  "outbox_events",
                  "durable_idempotency",
              }
              actual = set(inspector.get_table_names())
              missing = sorted(required - actual)
              print({"runtime_authoritative": runtime.is_canonical_ledger_authoritative,
                     "required_tables": sorted(required),
                     "missing_tables": missing,
                     "actual_tables": sorted(actual)})
              if missing:
                  raise SystemExit(f"canonical production tables missing: {missing}")
          finally:
              engine.dispose()
          PY
      - name: Run deep value-truth reconciliation tests
        run: |
          pytest -q tests/persistence/test_deep_value_reconciliation.py 2>&1 | tee evidence/postgres/pytest-deep-reconciliation.log
      - name: Capture final schema and migration evidence
        if: always()
        run: |
          psql "$GERCHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT table_schema, table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;" > evidence/postgres/final-schema.txt 2>&1 || true
          psql "$GERCHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT version, checksum, applied_at FROM schema_version ORDER BY version;' > evidence/postgres/final-migration-history.txt 2>&1 || true
          git rev-parse HEAD > evidence/postgres/final-commit.txt
      - name: Upload commit-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eai-postgres-reperformance-${{ github.sha }}
          path: evidence/postgres/
          if-no-files-found: error
          retention-days: 90
