name: Canonical EAI PostgreSQL Gate
# Production evidence gate: fresh PostgreSQL + canonical EAI flow.

on:
  workflow_dispatch:

jobs:
  canonical-eai-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install -r postgres/requirements-test.txt
          python -m pip install -r requirements-dee-security.txt
      - name: Run canonical EAI PostgreSQL gate
        env:
          GERCHAIN_POSTGRES_DSN: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: |
          python -m pytest -q postgres/tests/test_concurrency.py postgres/tests/test_canonical_eai_postgres.py
          python -m pytest -q tests/integration/test_production_runtime_postgresql.py
