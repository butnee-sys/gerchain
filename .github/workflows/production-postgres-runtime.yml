name: Production PostgreSQL Runtime

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]

jobs:
  production-postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install production PostgreSQL test dependencies
        run: |
          python -m pip install -r postgres/requirements-test.txt
          python -m pip install 'cryptography>=43,<47'

      - name: Verify production runtime and migrations
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
        run: python -m pytest -q tests/integration/test_ea35_postgres_production.py
