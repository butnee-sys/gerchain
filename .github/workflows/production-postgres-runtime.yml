name: Production PostgreSQL Runtime Smoke

on:
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]
  pull_request:
    branches: ["main"]

jobs:
  production-postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r postgres/requirements-test.txt

      - name: Verify production runtime construction
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_ESCROW_ID: smoke-escrow
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: USD
          GERCHAIN_WITNESS_ID: smoke-witness
        run: |
          python - <<'PY'
          import os
          from services.gerchain_runtime_factory import (
              ProductionRuntimeConfig,
              ProductionRuntimeFactory,
          )

          config = ProductionRuntimeConfig(
              database_url=os.environ["GERCHAIN_DATABASE_URL"],
              escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
              amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
              currency=os.environ["GERCHAIN_CURRENCY"],
              witness_id=os.environ["GERCHAIN_WITNESS_ID"],
          )
          factory = ProductionRuntimeFactory(config)
          runtime = factory.create()

          assert runtime.is_canonical_ledger_authoritative
          assert runtime.runtime_mode == "production-postgresql"
          print("PRODUCTION_RUNTIME_CANONICAL_AUTHORITY=PASS")
          PY

      - name: Verify production entrypoint boot path
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_ESCROW_ID: smoke-escrow-entrypoint
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: USD
          GERCHAIN_WITNESS_ID: smoke-witness-entrypoint
        run: |
          set +e
          timeout 8s python production_entrypoint.py > entrypoint.log 2>&1
          status=$?
          cat entrypoint.log
          if [ "$status" -ne 124 ]; then
            echo "Production entrypoint failed to reach steady state; exit=$status"
            exit "$status"
          fi
          grep -q "GerChain production runtime initialized" entrypoint.log
          grep -q "escrow=smoke-escrow-entrypoint" entrypoint.log
          echo "PRODUCTION_ENTRYPOINT_BOOT=PASS"
