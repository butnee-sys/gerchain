name: Production Runtime PostgreSQL

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/ea21-transaction-aware-ledger"]

jobs:
  production-runtime-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: python -m pip install -r requirements-dee-security.txt
      - name: Install PostgreSQL driver
        run: python -m pip install psycopg[binary]
      - name: Verify production runtime boot and migration
        env:
          GERCHAIN_DATABASE_URL: postgresql://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_ESCROW_ID: escrow-ci
          GERCHAIN_ESCROW_AMOUNT: "100"
          GERCHAIN_CURRENCY: USD
          GERCHAIN_WITNESS_ID: witness-ci
        run: python -c "from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory; import os; r=ProductionRuntimeFactory(ProductionRuntimeConfig(os.environ['GERCHAIN_DATABASE_URL'], os.environ['GERCHAIN_ESCROW_ID'], int(os.environ['GERCHAIN_ESCROW_AMOUNT']), os.environ['GERCHAIN_CURRENCY'], os.environ['GERCHAIN_WITNESS_ID'])).create(); assert r.is_canonical_ledger_authoritative"
