name: production-postgresql-reperformance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

jobs:
  postgres-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dee-security.txt pytest
      - run: pytest -q tests/integration/test_production_postgresql_reperformance.py
