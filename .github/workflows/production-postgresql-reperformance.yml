name: production-postgresql-reperformance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

jobs:
  postgres-production-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest

      - name: Production source compile gate
        run: |
          python -m py_compile services/gerchain_runtime.py services/gerchain_runtime_factory.py production_entrypoint.py

      - name: Production entrypoint boot smoke
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@127.0.0.1:5432/gerchain_test
          GERCHAIN_ESCROW_ID: ci-bootstrap
          GERCHAIN_ESCROW_AMOUNT: "1"
          GERCHAIN_CURRENCY: USD
          GERCHAIN_WITNESS_ID: ci-witness
        run: |
          set +e
          timeout 8s python production_entrypoint.py
          rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "production entrypoint failed before controlled shutdown (rc=$rc)"
            exit "$rc"
          fi
          echo "production entrypoint initialized and remained alive until timeout"

      - name: Migration concurrency re-performance
        env:
          GERCHAIN_POSTGRES_DSN: ${{ env.GERCHAIN_DATABASE_URL }}
        run: |
          pytest -q postgres/tests/test_concurrency.py::test_migrations_are_serialized_and_checksum_is_stable

      - name: Production PostgreSQL re-performance
        run: |
          pytest -q tests/integration/test_eai_production_runtime.py

      - name: Deep value truth regression
        run: |
          pytest -q tests/persistence/test_deep_value_reconciliation.py
