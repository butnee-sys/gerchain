name: production-postgresql-reperformance

on:
  push:
    branches:
      - "feat/ea21-transaction-aware-ledger"
  pull_request:

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:postgres@localhost:5432/gerchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: PostgreSQL production smoke
        run: pytest -q tests/integration/test_production_postgresql_smoke.py
      - name: Deep reconciliation regression
        run: pytest -q tests/persistence/test_deep_value_reconciliation.py
