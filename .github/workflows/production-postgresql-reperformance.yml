name: production-postgresql-reperformance

on:
  push:
    branches:
      - "feat/ea21-transaction-aware-ledger"
  pull_request:
  workflow_dispatch:

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: gerchain
          POSTGRES_DB: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:postgres@localhost:5432/gerchain
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:postgres@localhost:5432/gerchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt pytest
      - name: Apply production PostgreSQL schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U gerchain -d gerchain -v ON_ERROR_STOP=1 -f postgres/schema/001_concurrency.sql
      - name: Production entrypoint boot proof
        env:
          GERCHAIN_ESCROW_ID: pg-entrypoint-escrow
          GERCHAIN_ESCROW_AMOUNT: "40"
          GERCHAIN_CURRENCY: USD
          GERCHAIN_WITNESS_ID: pg-entrypoint-witness
        run: |
          set +e
          timeout 8s python production_entrypoint.py
          code=$?
          test "$code" -eq 124
      - name: Deep reconciliation regression
        run: pytest -q tests/persistence/test_deep_value_reconciliation.py
