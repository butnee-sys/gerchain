name: DEE Security Gate

on:
  pull_request:
    paths:
      - 'dee_security/**'
      - 'nef_gerchain_port/**'
      - 'shuud/**'
      - 'tests/test_dee_security.py'
      - 'tests/test_nef_gerchain_port.py'
      - 'tests/test_shuud_boundary.py'
      - 'requirements-dee-security.txt'
      - '.github/workflows/dee-security.yml'
  push:
    branches:
      - main
      - fix/ecosystem-separation
    paths:
      - 'dee_security/**'
      - 'nef_gerchain_port/**'
      - 'shuud/**'
      - 'tests/test_dee_security.py'
      - 'tests/test_nef_gerchain_port.py'
      - 'tests/test_shuud_boundary.py'
      - 'requirements-dee-security.txt'
      - '.github/workflows/dee-security.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install security and boundary dependencies
        run: python -m pip install -r requirements-dee-security.txt pytest fastapi pydantic
      - name: Verify DEE security primitives
        run: python -m pytest -q tests/test_dee_security.py
      - name: Verify EXIM Escrow Port boundary
        run: python -m pytest -q tests/test_nef_gerchain_port.py
      - name: Verify SHUUD ecosystem boundary
        run: python -m pytest -q tests/test_shuud_boundary.py
