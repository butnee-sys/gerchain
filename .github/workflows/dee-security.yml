name: DEE Security Gate

on:
  pull_request:
    paths:
      - 'dee_security/**'
      - 'nef_gerchain_port/**'
      - 'shuud/**'
      - 'tests/test_dee_security.py'
      - 'tests/test_dee_key_management.py'
      - 'tests/test_dee_persistent_registry.py'
      - 'tests/test_dee_runtime_governance.py'
      - 'tests/test_dee_recovery_governance.py'
      - 'tests/test_nef_gerchain_port.py'
      - 'tests/test_shuud_boundary.py'
      - 'tests/test_shuud_dee_e2e.py'
      - 'requirements-dee-security.txt'
      - '.github/workflows/dee-security.yml'
  push:
    branches:
      - main
      - fix/ecosystem-separation
      - feat/dee-owner-key-management
    paths:
      - 'dee_security/**'
      - 'nef_gerchain_port/**'
      - 'shuud/**'
      - 'tests/test_dee_security.py'
      - 'tests/test_dee_key_management.py'
      - 'tests/test_dee_persistent_registry.py'
      - 'tests/test_dee_runtime_governance.py'
      - 'tests/test_dee_recovery_governance.py'
      - 'tests/test_nef_gerchain_port.py'
      - 'tests/test_shuud_boundary.py'
      - 'tests/test_shuud_dee_e2e.py'
      - 'requirements-dee-security.txt'
      - '.github/workflows/dee-security.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dee
          POSTGRES_PASSWORD: dee
          POSTGRES_DB: dee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dee -d dee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEE_POSTGRES_URL: postgresql+psycopg://dee:dee@127.0.0.1:5432/dee_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install security and boundary dependencies
        run: python -m pip install -r requirements-dee-security.txt pytest fastapi pydantic
      - name: Verify DEE security primitives
        run: python -m pytest -q tests/test_dee_security.py
      - name: Verify DEE owner key lifecycle
        run: python -m pytest -q tests/test_dee_key_management.py
      - name: Verify persistent DEE owner registry
        run: python -m pytest -q tests/test_dee_persistent_registry.py
      - name: Verify DEE runtime governance
        run: python -m pytest -q tests/test_dee_runtime_governance.py
      - name: Verify DEE recovery governance
        run: python -m pytest -q tests/test_dee_recovery_governance.py
      - name: Verify EXIM Escrow Port boundary
        run: python -m pytest -q tests/test_nef_gerchain_port.py
      - name: Verify SHUUD ecosystem boundary
        run: python -m pytest -q tests/test_shuud_boundary.py
      - name: Verify SHUUD DEE E2E proof
        run: python -m pytest -q tests/test_shuud_dee_e2e.py
