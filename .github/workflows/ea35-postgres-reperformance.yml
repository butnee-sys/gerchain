name: EA-35 PostgreSQL Re-performance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger

jobs:
  postgres-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gerchain_test
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_reperformance
      GERCHAIN_ESCROW_ID: ea35-reperformance-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: MNT
      GERCHAIN_WITNESS_ID: ea35-reperformance-witness
      PYTHONPATH: .
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dee-security.txt
            postgres/requirements-test.txt

      - name: Install runtime dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt -r postgres/requirements-test.txt

      - name: Compile all production, persistence, migration, and CORE modules first
        run: python -m compileall -q services production_entrypoint.py persistence postgres

      - name: Run exact CORE fundamental-architecture gates (only after compileall passes)
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
          GERCHAIN_POSTGRES_DSN: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
        run: |
          pytest -q \
            tests/test_core_structure.py \
            tests/test_core_final_lock_contract.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_g3_core_boundary.py \
            tests/test_g3_core_runtime_e2e.py \
            tests/test_g3_dee_authorized_handler.py \
            tests/test_dee_security.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/production/test_runtime_source_compiles.py \
            tests/production/test_postgres_canonical_concurrency.py \
            tests/test_postgres_atomic_ledger.py \
            postgres/tests/test_concurrency.py \
            tests/test_production_runtime_factory.py

      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
              print("POSTGRES_CONNECTION=PASS")
          engine.dispose()
          PY

      - name: Capture migration registry before migration
        run: |
          mkdir -p artifacts/ea35
          python - <<'PY'
          import json, os
          import psycopg
          dsn = os.environ["GERCHAIN_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          with psycopg.connect(dsn) as connection:
              exists = connection.execute("SELECT to_regclass('public.schema_version')").fetchone()[0]
              rows = connection.execute("SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version").fetchall() if exists else []
          with open("artifacts/ea35/migration-registry-before.json", "w") as f:
              json.dump({"registry_exists": bool(exists), "rows": [list(row) for row in rows]}, f, indent=2)
          print(f"MIGRATION_REGISTRY_BEFORE_COUNT={len(rows)}")
          PY

      - name: Apply migrations and capture registry after migration
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg
          from postgres.migrations import apply_migrations
          dsn = os.environ["GERCHAIN_DATABASE_URL"]
          dsn = dsn.replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          with psycopg.connect(dsn) as connection:
              apply_migrations(connection, Path("postgres/migrations"))
              rows = connection.execute("SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version").fetchall()
              assert [row[0] for row in rows] == list(range(1, 14)), rows
              assert all(row[1] for row in rows), rows
          with open("artifacts/ea35/migration-registry-after.json", "w") as f:
              json.dump({"rows": [list(row) for row in rows]}, f, indent=2)
          print(f"MIGRATION_REGISTRY_AFTER_COUNT={len(rows)}")
          print(f"MIGRATION_REGISTRY_AFTER_SHA256_INPUT={[(row[0], row[1]) for row in rows]!r}")
          PY

      - name: Capture schema snapshot and exact 13-migration manifest
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          import psycopg
          from sqlalchemy import create_engine, inspect, text
          from postgres.migrations import _CANONICAL_FILES, checksum

          root = Path.cwd()
          dsn = os.environ["GERCHAIN_DATABASE_URL"]
          driver_dsn = dsn.replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          manifest_rows = []
          for version, name in enumerate(_CANONICAL_FILES, start=1):
              path = root / "postgres" / "migrations" / name
              source = path.read_text(encoding="utf-8")
              digest = checksum(source)
              manifest_rows.append({
                  "version": version,
                  "path": str(path.relative_to(root)),
                  "sha256": digest,
                  "bytes": path.stat().st_size,
              })

          with psycopg.connect(driver_dsn) as connection:
              pg_version = connection.execute("SELECT version()").fetchone()[0]
              applied = connection.execute(
                  "SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version"
              ).fetchall()
          expected = [(item["version"], item["sha256"]) for item in manifest_rows]
          actual = [(row[0], row[1]) for row in applied]
          assert actual == expected, {
              "reason": "database migration registry does not match the canonical 13-file manifest",
              "expected": expected,
              "actual": actual,
          }

          engine = create_engine(dsn, pool_pre_ping=True)
          inspector = inspect(engine)
          table_names = sorted(inspector.get_table_names())
          schema = {
              "commit_sha": os.environ["EVIDENCE_COMMIT_SHA"],
              "database": "gerchain_test",
              "postgres_version": pg_version,
              "schema_version": [
                  {"version": row[0], "checksum": row[1], "applied_at": row[2]}
                  for row in applied
              ],
              "tables": {
                  table: {
                      "columns": [
                          {"name": col["name"], "type": str(col["type"]), "nullable": col["nullable"]}
                          for col in inspector.get_columns(table)
                      ],
                      "primary_key": inspector.get_pk_constraint(table),
                      "foreign_keys": inspector.get_foreign_keys(table),
                      "indexes": inspector.get_indexes(table),
                  }
                  for table in table_names
              },
          }
          engine.dispose()

          out = root / "artifacts/ea35"
          out.mkdir(parents=True, exist_ok=True)
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit_sha": os.environ["EVIDENCE_COMMIT_SHA"],
              "workflow_run_id": os.environ["EVIDENCE_RUN_ID"],
              "workflow_run_attempt": os.environ["EVIDENCE_RUN_ATTEMPT"],
              "python": platform.python_version(),
              "postgres_version": pg_version,
              "migration_count": len(manifest_rows),
              "migration_files": manifest_rows,
              "database_registry_matches_manifest": True,
              "schema_snapshot_sha256": hashlib.sha256(
                  json.dumps(schema, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest(),
          }
          assert len(manifest_rows) == 13
          (out / "migration-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          (out / "postgres-schema-snapshot.json").write_text(json.dumps(schema, indent=2) + "\n", encoding="utf-8")
          (out / "commit-sha.txt").write_text(os.environ["EVIDENCE_COMMIT_SHA"] + "\n", encoding="utf-8")
          print("MIGRATION_MANIFEST=13/13")
          print("SCHEMA_VERSION_MATCHES_MANIFEST=PASS")
          print(f"POSTGRES_VERSION={pg_version}")
          print(f"SCHEMA_SNAPSHOT_SHA256={manifest['schema_snapshot_sha256']}")
          print(f"EVIDENCE_COMMIT_SHA={os.environ['EVIDENCE_COMMIT_SHA']}")
          PY

      - name: Upload exact-SHA PostgreSQL evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea35-postgres-evidence-${{ github.sha }}
          path: artifacts/ea35/
          if-no-files-found: warn
          retention-days: 90

      - name: Verify canonical migration runner compatibility and migration contracts
        run: |
          pytest -q tests/postgres/test_migrations.py

      - name: Verify checksum mismatch fails without partial schema or history changes
        run: |
          set -o pipefail
          pytest -vv -s postgres/tests/test_migration_checksum_atomicity.py 2>&1 | tee artifacts/ea35/checksum-runner.log

      - name: Re-perform concurrent migration publication on fresh PostgreSQL database
        run: |
          set -o pipefail
          pytest -vv -s postgres/tests/test_concurrency.py 2>&1 | tee artifacts/ea35/concurrency-runner.log

      - name: Create isolated PostgreSQL database for value-truth tests
        run: |
          PGPASSWORD=gerchain createdb -h localhost -U gerchain gerchain_reperformance
          PGPASSWORD=gerchain psql -h localhost -U gerchain -d gerchain_reperformance -c "SELECT current_database();"

      - name: Re-perform durable value-truth test suite on PostgreSQL
        run: |
          pytest -q tests/persistence/test_deep_value_reconciliation_postgres.py

      - name: Re-perform canonical atomic lifecycle, rollback, and replay tests on PostgreSQL
        run: |
          pytest -q -s tests/persistence/test_deep_value_reconciliation.py

      - name: Verify production factory boots with canonical Ledger authority
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from services.gerchain_runtime_factory import (
              ProductionRuntimeConfig,
              ProductionRuntimeFactory,
          )
          url = os.environ["GERCHAIN_DATABASE_URL"]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.begin() as connection:
              connection.execute(
                  text("""
                      INSERT INTO escrows
                          (id, sender_address, receiver_address, amount, state,
                           condition_desc, refund_destination, currency, version,
                           created_at, updated_at)
                      VALUES
                          (:id, :sender, :receiver, :amount, 'CREATED',
                           'CI production boot', :refund_destination, :currency, 0,
                           now(), now())
                      ON CONFLICT (id) DO NOTHING
                  """),
                  {
                      "id": os.environ["GERCHAIN_ESCROW_ID"],
                      "sender": "ci-source",
                      "receiver": "ci-beneficiary",
                      "amount": int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                      "refund_destination": "ci-source",
                      "currency": os.environ["GERCHAIN_CURRENCY"],
                  },
              )
          factory = ProductionRuntimeFactory(
              ProductionRuntimeConfig(
                  database_url=url,
                  escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
                  amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                  currency=os.environ["GERCHAIN_CURRENCY"],
                  witness_id=os.environ["GERCHAIN_WITNESS_ID"],
              ),
              engine=engine,
          )
          runtime = factory.create()
          assert runtime.is_canonical_ledger_authoritative, "canonical Ledger authority not configured"
          tables = set(inspect(engine).get_table_names())
          required = {
              "gerchain_ledger_accounts",
              "gerchain_ledger_movements",
          }
          missing = required - tables
          assert not missing, f"missing canonical Ledger tables: {sorted(missing)}"
          print("PRODUCTION_FACTORY_BOOT=PASS")
          print("CANONICAL_LEDGER_AUTHORITY=PASS")
          print("CANONICAL_LEDGER_TABLES=PASS")
          engine.dispose()
          PY


      - name: Verify the actual production entrypoint boots against PostgreSQL
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          command = [sys.executable, "-u", "production_entrypoint.py"]
          try:
              completed = subprocess.run(
                  command,
                  env=os.environ.copy(),
                  capture_output=True,
                  text=True,
                  timeout=8,
                  check=False,
              )
          except subprocess.TimeoutExpired as exc:
              stdout = exc.stdout or ""
              stderr = exc.stderr or ""
              if isinstance(stdout, bytes):
                  stdout = stdout.decode("utf-8", errors="replace")
              if isinstance(stderr, bytes):
                  stderr = stderr.decode("utf-8", errors="replace")
              output = stdout + "\\n" + stderr
              assert "GerChain production runtime initialized:" in output, output
              print("PRODUCTION_ENTRYPOINT_BOOT=PASS")
              print("PRODUCTION_ENTRYPOINT_REMAINS_ALIVE=PASS")
          else:
              output = completed.stdout + "\\n" + completed.stderr
              assert completed.returncode == 0, output
              assert "GerChain production runtime initialized:" in output, output
              print("PRODUCTION_ENTRYPOINT_BOOT=PASS")
              print("PRODUCTION_ENTRYPOINT_EXITED_CLEANLY=PASS")
          PY
