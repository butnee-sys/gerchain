name: EA-35 PostgreSQL re-performance

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  workflow_dispatch:

jobs:
  postgres-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gerchain
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt
          python -m pip install pytest

      - name: Verify production factory construction
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain
        run: |
          python - <<'PY'
          from services.gerchain_runtime_factory import ProductionRuntimeConfig, ProductionRuntimeFactory

          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          engine = create_engine("postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain")
          session_factory = sessionmaker(bind=engine, expire_on_commit=False)
          runtime = ProductionRuntimeFactory.create(
              escrow_id="ea35-smoke-escrow",
              amount=100,
              currency="USD",
              witness_id="ea35-smoke-witness",
              engine=engine,
              session_factory=session_factory,
          )
          assert runtime.is_canonical_ledger_authoritative
          print("CANONICAL_LEDGER_AUTHORITY=TRUE")
          PY

      - name: Run PostgreSQL canonical value-flow re-performance
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain
        run: |
          python -m pytest -q tests/integration/test_ea35_postgres_reperformance.py

      - name: Run EA-35 reconciliation tests
        run: |
          python -m pytest -q tests/persistence/test_deep_value_reconciliation.py

      - name: Run canonical value-flow tests
        run: |
          python -m pytest -q \
            tests/services/test_gerchain_runtime_refund_canonical.py \
            tests/services/test_gerchain_runtime_cancel_canonical.py \
            tests/services/test_gerchain_runtime_settlement_canonical.py \
            tests/services/test_gerchain_runtime_create_account_canonical.py
