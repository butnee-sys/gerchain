name: EA-35 PostgreSQL Re-performance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger

jobs:
  postgres-reperformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gerchain_test
          POSTGRES_USER: gerchain
          POSTGRES_PASSWORD: gerchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerchain -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_test
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_reperformance
      GERCHAIN_UPGRADE_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_upgrade
      GERCHAIN_ESCROW_ID: ea35-reperformance-escrow
      GERCHAIN_ESCROW_AMOUNT: "100"
      GERCHAIN_CURRENCY: MNT
      GERCHAIN_WITNESS_ID: ea35-reperformance-witness
      PYTHONPATH: .
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert checkout matches requested evidence SHA
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          expected = os.environ['EXPECTED_COMMIT_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'EXPECTED_COMMIT_SHA={expected}')
          print(f'CHECKED_OUT_HEAD_SHA={actual}')
          if actual != expected:
              raise SystemExit('FAIL: checkout HEAD differs from evidence SHA')
          print('CHECKOUT_SHA_MATCH=PASS')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dee-security.txt
            postgres/requirements-test.txt

      - name: Install runtime dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dee-security.txt -r postgres/requirements-test.txt

      - name: Compile all production, persistence, migration, and CORE modules first
        run: python -m compileall -q services production_entrypoint.py persistence postgres

      - name: Create isolated PostgreSQL test database
        run: |
          PGPASSWORD=gerchain createdb -h localhost -U gerchain gerchain_reperformance
          PGPASSWORD=gerchain createdb -h localhost -U gerchain gerchain_upgrade
          PGPASSWORD=gerchain psql -h localhost -U gerchain -d gerchain_reperformance -c "SELECT current_database();"
          PGPASSWORD=gerchain psql -h localhost -U gerchain -d gerchain_upgrade -c "SELECT current_database();"

      - name: Prepare test evidence directory
        if: always()
        run: mkdir -p artifacts/ea35

      - name: Run exact CORE fundamental-architecture gates (only after compileall passes)
        env:
          GERCHAIN_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_reperformance
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_reperformance
          GERCHAIN_POSTGRES_DSN: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_reperformance
        run: |
          pytest -q \
            tests/test_core_structure.py \
            tests/test_core_final_lock_contract.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_g3_core_boundary.py \
            tests/test_g3_core_runtime_e2e.py \
            tests/test_g3_dee_authorized_handler.py \
            tests/test_dee_security.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/production/test_runtime_source_compiles.py \
            tests/production/test_postgres_canonical_concurrency.py \
            tests/test_postgres_atomic_ledger.py \
            postgres/tests/test_concurrency.py \
            tests/test_production_runtime_factory.py \
            --junitxml=artifacts/ea35/junit.xml

      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
              print("POSTGRES_CONNECTION=PASS")
          engine.dispose()
          PY

      - name: Capture migration registry before migration
        run: |
          mkdir -p artifacts/ea35
          python - <<'PY'
          import json, os
          import psycopg
          dsn = os.environ["GERCHAIN_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          with psycopg.connect(dsn) as connection:
              exists = connection.execute("SELECT to_regclass('public.schema_version')").fetchone()[0]
              rows = connection.execute("SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version").fetchall() if exists else []
          with open("artifacts/ea35/migration-registry-before.json", "w") as f:
              json.dump({"registry_exists": bool(exists), "rows": [list(row) for row in rows]}, f, indent=2)
          print(f"MIGRATION_REGISTRY_BEFORE_COUNT={len(rows)}")
          PY

      - name: Apply migrations and capture registry after migration
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg
          from postgres.migrations import apply_migrations
          dsn = os.environ["GERCHAIN_DATABASE_URL"]
          dsn = dsn.replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          with psycopg.connect(dsn) as connection:
              apply_migrations(connection, Path("postgres/migrations"))
              rows_first = connection.execute(
                  "SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version"
              ).fetchall()
              assert [row[0] for row in rows_first] == list(range(1, 17)), rows_first
              assert all(row[1] for row in rows_first), rows_first
              constraints_first = connection.execute("""
                  SELECT conname, contype, convalidated, pg_get_constraintdef(oid)
                  FROM pg_constraint
                  WHERE connamespace = 'public'::regnamespace
                  ORDER BY conrelid::regclass::text, conname
              """).fetchall()

              # A SELECT opens an implicit psycopg transaction. The migration
              # runner deliberately requires an idle connection, so close the
              # read transaction before the second invocation.
              connection.commit()

              # Idempotency gate: a second run must not add migration rows,
              # change checksums, rewrite applied_at timestamps, or alter constraints.
              apply_migrations(connection, Path("postgres/migrations"))
              rows_second = connection.execute(
                  "SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version"
              ).fetchall()
              constraints_second = connection.execute("""
                  SELECT conname, contype, convalidated, pg_get_constraintdef(oid)
                  FROM pg_constraint
                  WHERE connamespace = 'public'::regnamespace
                  ORDER BY conrelid::regclass::text, conname
              """).fetchall()
              assert rows_second == rows_first, {
                  "reason": "second migration run changed the registry",
                  "first": rows_first,
                  "second": rows_second,
              }
              assert constraints_second == constraints_first, {
                  "reason": "second migration run changed PostgreSQL constraints",
                  "first": constraints_first,
                  "second": constraints_second,
              }
              rows = rows_second
          with open("artifacts/ea35/migration-registry-after.json", "w") as f:
              json.dump({"rows": [list(row) for row in rows]}, f, indent=2)
          with open("artifacts/ea35/pg-constraints-after-first-run.json", "w") as f:
              json.dump({"rows": [list(row) for row in constraints_first]}, f, indent=2)
          with open("artifacts/ea35/pg-constraints-after-second-run.json", "w") as f:
              json.dump({"rows": [list(row) for row in constraints_second]}, f, indent=2)
          print(f"MIGRATION_REGISTRY_AFTER_COUNT={len(rows)}")
          print("MIGRATION_RERUN_IDEMPOTENCY=PASS")
          print("PG_CONSTRAINTS_STABLE_AFTER_RERUN=PASS")
          print(f"MIGRATION_REGISTRY_AFTER_SHA256_INPUT={[(row[0], row[1]) for row in rows]!r}")
          PY

      - name: Re-perform upgrade from canonical migrations 001-014 through 016
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          import psycopg
          from postgres.migrations import _canonical_migration_files, apply_migrations

          raw = os.environ['GERCHAIN_UPGRADE_DATABASE_URL']
          dsn = raw.replace('postgresql+psycopg://', 'postgresql://').replace('postgresql+psycopg2://', 'postgresql://')
          canonical = _canonical_migration_files(Path('postgres/migrations'))
          with tempfile.TemporaryDirectory(prefix='gerchain-migrations-001-014-') as tmp:
              stage = Path(tmp)
              for version, source in enumerate(canonical[:14], start=1):
                  (stage / source.name).write_text(source.read_text(encoding='utf-8'), encoding='utf-8')
              with psycopg.connect(dsn) as connection:
                  applied = apply_migrations(connection, stage)
                  assert applied == tuple(range(1, 15)), applied
                  before = connection.execute('SELECT version, checksum, applied_at FROM schema_version ORDER BY version').fetchall()
                  assert [row[0] for row in before] == list(range(1, 15)), before
                  before_checksums = [(row[0], row[1]) for row in before]
                  connection.commit()
                  connection.execute("""
                      ALTER TABLE escrows
                      ADD CONSTRAINT legacy_reintroduced_state_check
                      CHECK (state IN ('CREATED', 'LOCKED', 'RELEASED'))
                  """)
                  connection.commit()
                  applied_015 = apply_migrations(connection, Path('postgres/migrations'))
                  assert applied_015 == (15, 16), applied_015
                  after = connection.execute('SELECT version, checksum, applied_at FROM schema_version ORDER BY version').fetchall()
                  assert [row[0] for row in after] == list(range(1, 17)), after
                  assert [(row[0], row[1]) for row in after[:14]] == before_checksums
                  state_constraints = connection.execute("""
                      SELECT conname, convalidated, pg_get_constraintdef(oid)
                      FROM pg_constraint
                      WHERE conrelid = 'escrows'::regclass
                        AND contype = 'c'
                        AND pg_get_constraintdef(oid) ILIKE '%state%'
                      ORDER BY conname
                  """).fetchall()
                  assert len(state_constraints) == 1, f'expected exactly one escrow state CHECK constraint, found: {state_constraints}'
                  constraint = state_constraints[0]
                  assert constraint[0] == 'escrows_state_canonical_check', constraint
                  assert constraint[1] is True, f'constraint is not validated: {constraint}'
                  assert all(value in constraint[2] for value in ('CREATED', 'FUNDED', 'LOCKED', 'RELEASED', 'REFUNDED', 'CANCELLED')), constraint
                  connection.commit()
                  rerun = apply_migrations(connection, Path('postgres/migrations'))
                  assert rerun == (), rerun
                  final = connection.execute('SELECT version, checksum, applied_at FROM schema_version ORDER BY version').fetchall()
                  assert final == after, 'rerun changed schema_version rows/checksums/timestamps'
                  print('UPGRADE_001_014_TO_016=PASS')
                  print('PREVIOUS_001_014_CHECKSUMS_PRESERVED=PASS')
                  print('ESCROW_STATE_CONSTRAINT_REPAIR_AND_VALIDATION=PASS')
                  print('UPGRADE_RERUN_IDEMPOTENCY=PASS')
          PY

      - name: Capture schema snapshot and exact 16-migration manifest
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          import psycopg
          from sqlalchemy import create_engine, inspect, text
          from postgres.migrations import _canonical_migration_files, checksum

          root = Path.cwd()
          dsn = os.environ["GERCHAIN_DATABASE_URL"]
          driver_dsn = dsn.replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          manifest_rows = []
          for version, path in enumerate(_canonical_migration_files(root / "postgres" / "migrations"), start=1):
              name = path.name
              source = path.read_text(encoding="utf-8")
              digest = checksum(source)
              manifest_rows.append({
                  "version": version,
                  "path": str(path.relative_to(root)),
                  "sha256": digest,
                  "bytes": path.stat().st_size,
              })

          with psycopg.connect(driver_dsn) as connection:
              pg_version = connection.execute("SELECT version()").fetchone()[0]
              applied = connection.execute(
                  "SELECT version, checksum, applied_at::text FROM schema_version ORDER BY version"
              ).fetchall()
              state_constraints = connection.execute("""
                  SELECT conname, convalidated, pg_get_constraintdef(oid)
                  FROM pg_constraint
                  WHERE conrelid = 'escrows'::regclass
                    AND contype = 'c'
                    AND pg_get_constraintdef(oid) ILIKE '%state%'
                  ORDER BY conname
              """).fetchall()
              assert len(state_constraints) == 1, f"expected exactly one escrow state CHECK constraint, found: {state_constraints}"
              constraint = state_constraints[0]
              assert constraint[0] == "escrows_state_canonical_check", constraint
              assert constraint[1] is True, f"canonical escrow state constraint not validated: {constraint}"
              assert all(value in constraint[2] for value in ("CREATED", "FUNDED", "LOCKED", "RELEASED", "REFUNDED", "CANCELLED")), constraint
          expected = [(item["version"], item["sha256"]) for item in manifest_rows]
          actual = [(row[0], row[1]) for row in applied]
          assert actual == expected, {
              "reason": "database migration registry does not match the canonical 16-file manifest",
              "expected": expected,
              "actual": actual,
          }

          engine = create_engine(dsn, pool_pre_ping=True)
          inspector = inspect(engine)
          table_names = sorted(inspector.get_table_names())
          schema = {
              "commit_sha": os.environ["EVIDENCE_COMMIT_SHA"],
              "database": "gerchain_test",
              "postgres_version": pg_version,
              "schema_version": [
                  {"version": row[0], "checksum": row[1], "applied_at": row[2]}
                  for row in applied
              ],
              "tables": {
                  table: {
                      "columns": [
                          {"name": col["name"], "type": str(col["type"]), "nullable": col["nullable"]}
                          for col in inspector.get_columns(table)
                      ],
                      "primary_key": inspector.get_pk_constraint(table),
                      "foreign_keys": inspector.get_foreign_keys(table),
                      "indexes": inspector.get_indexes(table),
                  }
                  for table in table_names
              },
          }
          engine.dispose()

          out = root / "artifacts/ea35"
          out.mkdir(parents=True, exist_ok=True)
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit_sha": os.environ["EVIDENCE_COMMIT_SHA"],
              "workflow_run_id": os.environ["EVIDENCE_RUN_ID"],
              "workflow_run_attempt": os.environ["EVIDENCE_RUN_ATTEMPT"],
              "python": platform.python_version(),
              "postgres_version": pg_version,
              "migration_count": len(manifest_rows),
              "migration_files": manifest_rows,
              "database_registry_matches_manifest": True,
              "schema_snapshot_sha256": hashlib.sha256(
                  json.dumps(schema, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest(),
          }
          assert len(manifest_rows) == 16
          (out / "migration-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          (out / "postgres-schema-snapshot.json").write_text(json.dumps(schema, indent=2) + "\n", encoding="utf-8")
          (out / "commit-sha.txt").write_text(os.environ["EVIDENCE_COMMIT_SHA"] + "\n", encoding="utf-8")
          print("MIGRATION_MANIFEST=16/16")
          print("SCHEMA_VERSION_MATCHES_MANIFEST=PASS")
          print(f"POSTGRES_VERSION={pg_version}")
          print(f"SCHEMA_SNAPSHOT_SHA256={manifest['schema_snapshot_sha256']}")
          print(f"EVIDENCE_COMMIT_SHA={os.environ['EVIDENCE_COMMIT_SHA']}")
          PY

      - name: Verify canonical migration runner compatibility and migration contracts
        run: |
          pytest -q tests/postgres/test_migrations.py
          pytest -q postgres/tests/test_schema_version_bootstrap_contract.py

      - name: Verify checksum mismatch fails without partial schema or history changes
        run: |
          set -o pipefail
          pytest -vv -s postgres/tests/test_migration_checksum_atomicity.py 2>&1 | tee artifacts/ea35/checksum-runner.log

      - name: Re-perform concurrent migration publication on fresh PostgreSQL database
        run: |
          set -o pipefail
          pytest -vv -s postgres/tests/test_concurrency.py 2>&1 | tee artifacts/ea35/concurrency-runner.log

      - name: Confirm isolated PostgreSQL test database remains available
        run: PGPASSWORD=gerchain psql -h localhost -U gerchain -d gerchain_reperformance -c "SELECT current_database();"

      - name: Re-perform durable value-truth test suite on PostgreSQL
        run: |
          pytest -q tests/persistence/test_deep_value_reconciliation_postgres.py

      - name: Re-perform CREATE/FUND/LOCK/RELEASE/REFUND/CANCEL/SETTLEMENT on PostgreSQL
        env:
          GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://gerchain:gerchain@localhost:5432/gerchain_reperformance
        run: |
          pytest -q -s tests/persistence/test_canonical_lifecycle_postgres.py

      - name: Re-perform canonical atomic lifecycle, rollback, and replay tests on PostgreSQL
        run: |
          pytest -q -s tests/persistence/test_deep_value_reconciliation.py

      - name: Verify production factory boots with canonical Ledger authority
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from services.gerchain_runtime_factory import (
              ProductionRuntimeConfig,
              ProductionRuntimeFactory,
          )
          url = os.environ["GERCHAIN_DATABASE_URL"]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.begin() as connection:
              connection.execute(
                  text("""
                      INSERT INTO escrows
                          (id, sender_address, receiver_address, amount, state,
                           condition_desc, refund_destination, currency, version,
                           created_at, updated_at)
                      VALUES
                          (:id, :sender, :receiver, :amount, 'CREATED',
                           'CI production boot', :refund_destination, :currency, 0,
                           now(), now())
                      ON CONFLICT (id) DO NOTHING
                  """),
                  {
                      "id": os.environ["GERCHAIN_ESCROW_ID"],
                      "sender": "ci-source",
                      "receiver": "ci-beneficiary",
                      "amount": int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                      "refund_destination": "ci-source",
                      "currency": os.environ["GERCHAIN_CURRENCY"],
                  },
              )
          factory = ProductionRuntimeFactory(
              ProductionRuntimeConfig(
                  database_url=url,
                  escrow_id=os.environ["GERCHAIN_ESCROW_ID"],
                  amount=int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                  currency=os.environ["GERCHAIN_CURRENCY"],
                  witness_id=os.environ["GERCHAIN_WITNESS_ID"],
              ),
              engine=engine,
          )
          runtime = factory.create()
          assert runtime.is_canonical_ledger_authoritative, "canonical Ledger authority not configured"
          tables = set(inspect(engine).get_table_names())
          required = {
              "gerchain_ledger_accounts",
              "gerchain_ledger_movements",
          }
          missing = required - tables
          assert not missing, f"missing canonical Ledger tables: {sorted(missing)}"
          print("PRODUCTION_FACTORY_BOOT=PASS")
          print("CANONICAL_LEDGER_AUTHORITY=PASS")
          print("CANONICAL_LEDGER_TABLES=PASS")
          engine.dispose()
          PY


      - name: Verify the actual production entrypoint boots against PostgreSQL
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          command = [sys.executable, "-u", "production_entrypoint.py"]
          try:
              completed = subprocess.run(
                  command,
                  env=os.environ.copy(),
                  capture_output=True,
                  text=True,
                  timeout=8,
                  check=False,
              )
          except subprocess.TimeoutExpired as exc:
              stdout = exc.stdout or ""
              stderr = exc.stderr or ""
              if isinstance(stdout, bytes):
                  stdout = stdout.decode("utf-8", errors="replace")
              if isinstance(stderr, bytes):
                  stderr = stderr.decode("utf-8", errors="replace")
              output = stdout + "\\n" + stderr
              assert "GerChain production runtime initialized:" in output, output
              print("PRODUCTION_ENTRYPOINT_BOOT=PASS")
              print("PRODUCTION_ENTRYPOINT_REMAINS_ALIVE=PASS")
          else:
              output = completed.stdout + "\\n" + completed.stderr
              assert completed.returncode == 0, output
              assert "GerChain production runtime initialized:" in output, output
              print("PRODUCTION_ENTRYPOINT_BOOT=PASS")
              print("PRODUCTION_ENTRYPOINT_EXITED_CLEANLY=PASS")
          PY

      - name: Finalize exact-SHA evidence report
        if: always()
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_WORKFLOW: ${{ github.workflow }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("artifacts/ea35")
          root.mkdir(parents=True, exist_ok=True)
          expected_sha = os.environ["EVIDENCE_COMMIT_SHA"]
          checked_out_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          junit_path = root / "junit.xml"
          junit_generated_by_pytest = junit_path.exists()
          if not junit_generated_by_pytest:
              junit_path.write_text(
                  '<?xml version="1.0" encoding="UTF-8"?>\\n'
                  '<testsuites tests="0" failures="0" errors="0" skipped="0">'
                  '<testsuite name="pytest-not-run" tests="0" failures="0" errors="0" skipped="0">'
                  '<system-out>pytest did not produce JUnit XML; this is a placeholder, not passing test evidence.</system-out>'
                  '</testsuite></testsuites>\\n',
                  encoding="utf-8",
              )

          junit_sha256 = hashlib.sha256(junit_path.read_bytes()).hexdigest()
          xml_root = ET.parse(junit_path).getroot()
          suites = [xml_root] if xml_root.tag == "testsuite" else list(xml_root.iter("testsuite"))
          counts = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for suite in suites:
              for key in counts:
                  counts[key] += int(suite.attrib.get(key, "0"))
          manifest_migration = root / "migration-manifest.json"
          migration_data = json.loads(manifest_migration.read_text(encoding="utf-8")) if manifest_migration.exists() else {}
          manifest_commit = migration_data.get("commit_sha")
          commit_matches = checked_out_head == expected_sha and (manifest_commit is None or manifest_commit == expected_sha)
          report = {
              "repository": os.environ["EVIDENCE_REPOSITORY"],
              "workflow": os.environ["EVIDENCE_WORKFLOW"],
              "commit_sha": expected_sha,
              "checked_out_head_sha": checked_out_head,
              "migration_manifest_commit_sha": manifest_commit,
              "run_id": int(os.environ["EVIDENCE_RUN_ID"]),
              "run_attempt": int(os.environ["EVIDENCE_RUN_ATTEMPT"]),
              "job_status_at_finalization": os.environ["EVIDENCE_JOB_STATUS"],
              "junit": {
                  "path": "artifacts/ea35/junit.xml",
                  "sha256": junit_sha256,
                  "generated_by_pytest": junit_generated_by_pytest,
                  **counts,
              },
              "commit_sha_matches_checkout_and_migration_manifest": commit_matches,
              "evidence_complete": False,
          }
          (root / "manifest.json").write_text(json.dumps(report, indent=2) + "\\n", encoding="utf-8")

          if not commit_matches:
              print("EVIDENCE_CLOSEOUT=BLOCKED_SHA_MISMATCH")
              raise SystemExit("FAIL: commit SHA differs between workflow, checkout, and migration manifest")
          print("JUNIT_XML_SHA256=" + junit_sha256)
          print("JUNIT_XML_COUNTS=" + json.dumps(counts, sort_keys=True))
          print("EVIDENCE_RUN_ID=" + report["run_id"].__str__())
          print("EVIDENCE_RUN_ATTEMPT=" + report["run_attempt"].__str__())
          print("JUNIT_GENERATED_BY_PYTEST=" + str(junit_generated_by_pytest))
          PY

      - name: Generate SHA256SUMS for evidence bundle
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("artifacts/ea35")
          target = root / "SHA256SUMS"
          entries = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != target.name:
                  entries.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          target.write_text("\\n".join(entries) + "\\n", encoding="utf-8")
          print(f"SHA256SUMS_ENTRIES={len(entries)}")
          PY

      - name: Upload exact-SHA PostgreSQL evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea35-postgres-evidence-${{ github.sha }}
          path: artifacts/ea35/
          if-no-files-found: warn
          retention-days: 90
