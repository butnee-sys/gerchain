name: Canonical PostgreSQL production gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
      - fix/ea35-fail-closed-controller

jobs:
  canonical-postgres-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerchain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain_test
      GERCHAIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gerchain_test
      GERCHAIN_ESCROW_ID: ci-escrow
      GERCHAIN_ESCROW_AMOUNT: "10"
      GERCHAIN_CURRENCY: MNT
      GERCHAIN_WITNESS_ID: ci-witness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dee-security.txt -r postgres/requirements-test.txt
      - name: Prepare migration evidence directory
        if: always()
        run: mkdir -p artifacts/ea35/logs
      - name: Compile production and persistence modules
        run: set -o pipefail; python -m compileall -q production_entrypoint.py persistence services core postgres 2>&1 | tee artifacts/ea35/logs/python-compile.log
      - name: Collect CORE foundation regression tests separately
        run: set -o pipefail; pytest --collect-only -q tests/services/test_gerchain_runtime_atomic_lifecycle.py tests/services/test_gerchain_runtime_canonical_ledger.py tests/services/test_gerchain_runtime_factory.py tests/persistence/test_deep_value_reconciliation.py tests/postgres/test_migrations.py tests/postgres/test_migration_manifest.py 2>&1 | tee artifacts/ea35/logs/pytest-collection.log
      - name: Run CORE foundation regression tests
        run: >-
          pytest -q
          tests/services/test_gerchain_runtime_atomic_lifecycle.py
          tests/services/test_gerchain_runtime_canonical_ledger.py
          tests/services/test_gerchain_runtime_factory.py
          tests/persistence/test_deep_value_reconciliation.py
          tests/postgres/test_migrations.py
          tests/postgres/test_migration_manifest.py
      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ["GERCHAIN_TEST_DATABASE_URL"]
          dsn = dsn.replace("postgresql+psycopg://", "postgresql://").replace("postgresql+psycopg2://", "postgresql://")
          with psycopg.connect(dsn) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_database(), version()")
                  database, version = cursor.fetchone()
                  assert database == "gerchain_test", database
                  line = f"PASS: PostgreSQL connection: {database}; {version}"
                  print(line)
                  from pathlib import Path
                  Path("artifacts/ea35/logs/postgres-connection-primary.log").write_text(line + "\n", encoding="utf-8")
          PY
      - name: Validate checksum atomicity and duplicate migration publication
        run: set -o pipefail; pytest -vv -s postgres/tests/test_migration_checksum_atomicity.py tests/postgres/test_migration_runner_concurrency.py 2>&1 | tee artifacts/ea35/logs/checksum-atomicity-concurrency.log
      - name: Re-perform legacy escrow constraint upgrade and data preservation
        run: set -o pipefail; pytest -vv -s tests/postgres/test_legacy_escrow_constraint_upgrade.py 2>&1 | tee artifacts/ea35/logs/legacy-escrow-upgrade.log
      - name: Re-perform canonical PostgreSQL escrow lifecycle
        run: set -o pipefail; pytest -vv -s tests/postgres/test_production_postgres_reperformance.py 2>&1 | tee artifacts/ea35/logs/production-lifecycle.log
      - name: Re-perform PostgreSQL migration concurrency and checksum gate
        run: set -o pipefail; python -m pytest -vv -s postgres/tests/test_concurrency.py 2>&1 | tee artifacts/ea35/logs/migration-concurrency.log
      - name: Re-perform duplicate publication and checksum fail-closed cases on PostgreSQL
        run: set -o pipefail; pytest -vv -s postgres/tests/test_migration_publication_integrity.py 2>&1 | tee artifacts/ea35/logs/migration-publication-integrity.log
      - name: Bind all 17 migration checksums and validate canonical constraints from PostgreSQL catalog
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import psycopg
          from postgres.migrations import _canonical_migration_files, checksum

          root = Path.cwd()
          selected = _canonical_migration_files(root / "postgres/migrations")
          assert [int(p.name.split("_", 1)[0]) for p in selected] == list(range(1, 18)), (
              "canonical migration chain must be exactly versions 1..17"
          )
          source_by_version = {}
          for path in selected:
              version = int(path.name.split("_", 1)[0])
              source = path.read_text(encoding="utf-8")
              source_by_version[version] = {
                  "version": version,
                  "path": str(path.relative_to(root)),
                  "file_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "runner_checksum": checksum(source),
              }

          dsn = os.environ["GERCHAIN_TEST_DATABASE_URL"].replace(
              "postgresql+psycopg://", "postgresql://"
          ).replace("postgresql+psycopg2://", "postgresql://")
          with psycopg.connect(dsn) as conn:
              rows = conn.execute(
                  "SELECT version, checksum, applied_at FROM schema_version ORDER BY version"
              ).fetchall()
              assert [row[0] for row in rows] == list(range(1, 18)), (
                  f"schema_version must contain exactly 17 unique rows; got {rows}"
              )
              evidence = []
              for source, row in zip(source_by_version.values(), rows):
                  version, database_checksum, applied_at = row
                  # This job applies the canonical chain to a fresh PostgreSQL
                  # database, so every published checksum must match the exact
                  # migration source checked out at this commit. Historical aliases
                  # are tested by dedicated upgrade/re-performance jobs.
                  expected_checksum = source["runner_checksum"]
                  assert database_checksum == expected_checksum, (
                      f"version {version} checksum differs from exact checked-out source: "
                      f"database={database_checksum}; expected={expected_checksum}"
                  )
                  assert applied_at is not None, f"version {version} has no applied_at"
                  evidence.append({
                      **source,
                      "database_checksum": database_checksum,
                      "applied_at": applied_at.isoformat(),
                  })

              # Check the actual PostgreSQL catalog, including validation state
              # and duplicate/legacy state checks that could otherwise survive
              # under a different name.
              constraint_rows = conn.execute("""
                  SELECT c.conname, c.convalidated, c.contype,
                         t.relname AS table_name,
                         pg_get_constraintdef(c.oid) AS definition
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'public'
                    AND t.relname = 'escrows'
                    AND c.contype = 'c'
                    AND pg_get_constraintdef(c.oid) ILIKE '%state%'
                  ORDER BY c.conname
              """).fetchall()
              assert len(constraint_rows) == 1, (
                  "expected exactly one escrow-state CHECK constraint, "
                  f"found {constraint_rows}"
              )
              name, validated, kind, table_name, definition = constraint_rows[0]
              assert name == "escrows_state_canonical_check", name
              assert validated is True, f"constraint is NOT VALID: {name}"
              normalized = definition.lower()
              for state in ("created", "funded", "locked", "released", "refunded", "cancelled"):
                  assert state in normalized, f"canonical state missing from {name}: {state}"
              witness_constraints = conn.execute("""
                  SELECT conname, convalidated, pg_get_constraintdef(oid)
                  FROM pg_constraint
                  WHERE conrelid = 'gerchain_transaction_witnesses'::regclass
                    AND contype = 'c'
                    AND conname = 'gerchain_witness_event_type_check'
              """).fetchall()
              assert len(witness_constraints) == 1, (
                  "expected one canonical witness event CHECK constraint, "
                  f"found {witness_constraints}"
              )
              witness_name, witness_validated, witness_definition = witness_constraints[0]
              assert witness_validated is True, f"witness event constraint is NOT VALID: {witness_name}"
              assert "gerchain_created" in witness_definition.lower(), (
                  f"migration 017 did not enable GERCHAIN_CREATED witness evidence: {witness_definition}"
              )
              print("PASS: all 17 migration rows have accepted checksums and applied_at")
              print("PASS: escrow-state CHECK is unique, canonical, and convalidated=true")
              print("PASS: migration 017 enables validated GERCHAIN_CREATED witness evidence")
              for item in evidence:
                  print(item)
              print({
                  "constraint_name": name,
                  "convalidated": validated,
                  "table": table_name,
                  "definition": definition,
              })
          PY

      - name: Build canonical migration evidence manifest
        if: always()
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          root = Path.cwd()
          from postgres.migrations import _canonical_migration_files, checksum
          import psycopg
          migration_dir = root / 'postgres/migrations'
          selected = _canonical_migration_files(migration_dir)
          canonical = [
              {'version': int(p.name.split('_', 1)[0]),
               'path': str(p.relative_to(root)),
               'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
               'runner_checksum': checksum(p.read_text(encoding='utf-8')),
               'bytes': p.stat().st_size}
              for p in selected
          ]
          if [item['version'] for item in canonical] != list(range(1, 18)):
              raise SystemExit('canonical migration chain is not exactly versions 1..17')
          database_rows = []
          database_error = None
          dsn = (os.environ.get('GERCHAIN_TEST_DATABASE_URL') or os.environ.get('GERCHAIN_DATABASE_URL') or '').replace('postgresql+psycopg://', 'postgresql://').replace('postgresql+psycopg2://', 'postgresql://')
          if dsn:
              try:
                  with psycopg.connect(dsn) as conn:
                      identity = conn.execute("SELECT current_database(), current_user, version()").fetchone()
                      connection_line = f"PASS: PostgreSQL migration-evidence connection: database={identity[0]}; user={identity[1]}; server={identity[2]}"
                      (root / 'artifacts/ea35/logs/postgres-connection-migration-evidence.log').write_text(connection_line + '\n', encoding='utf-8')
                      exists = conn.execute("SELECT to_regclass('public.schema_version')").fetchone()[0]
                      if exists:
                          database_rows = [
                              {'version': row[0], 'checksum': row[1], 'applied_at': row[2].isoformat() if row[2] else None}
                              for row in conn.execute("SELECT version, checksum, applied_at FROM schema_version ORDER BY version").fetchall()
                          ]
              except Exception as exc:
                  database_error = f'{type(exc).__name__}: {exc}'
          expected_versions = list(range(1, 18))
          actual_versions = [row['version'] for row in database_rows]
          if database_error:
              raise SystemExit(f'PostgreSQL migration evidence unavailable: {database_error}')
          if actual_versions != expected_versions:
              raise SystemExit(f'expected schema_version rows {expected_versions}; got {actual_versions}')
          db_by_version = {row['version']: row['checksum'] for row in database_rows}
          for item in canonical:
              item['database_checksum'] = db_by_version.get(item['version'])
              item['database_checksum_matches_runner'] = (
                  item['database_checksum'] == item['runner_checksum']
                  if item['database_checksum'] is not None else None
              )
          manifest = {
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'commit_sha': os.environ['EVIDENCE_COMMIT_SHA'],
              'workflow_run_id': os.environ['EVIDENCE_RUN_ID'],
              'workflow_run_attempt': os.environ['EVIDENCE_RUN_ATTEMPT'],
              'python': platform.python_version(),
              'canonical_migration_count': len(canonical),
              'canonical_migrations': canonical,
              'schema_version_rows': database_rows,
              'database_manifest_error': database_error,
          }
          head_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest['checked_out_head_sha'] = head_sha
          manifest['commit_sha_matches_head'] = manifest['commit_sha'] == head_sha
          manifest['git_status_porcelain'] = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, check=False).stdout.splitlines()
          out = root / 'artifacts/ea35'
          out.mkdir(parents=True, exist_ok=True)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (out / 'commit-sha.txt').write_text(manifest['commit_sha'] + '\n', encoding='utf-8')
          # Produce a human-readable migration history and test summary before sealing checksums.
          migration_lines = [
              '# PostgreSQL Migration History Summary', '',
              f'- Exact commit SHA: {manifest["commit_sha"]}',
              f'- Workflow run: {manifest["workflow_run_id"]} (attempt {manifest["workflow_run_attempt"]})',
              f'- Canonical migrations: {len(canonical)} (expected versions 1..17)',
              f'- Database schema_version rows: {len(database_rows)}',
              f'- Every runner checksum equals the PostgreSQL-published checksum: {all(item["database_checksum_matches_runner"] is True for item in canonical)}',
              '', '| Version | Migration | SHA-256 | DB checksum matches |', '|---:|---|---|---|'
          ]
          for item in canonical:
              migration_lines.append(f'| {item["version"]} | {item["path"]} | {item["sha256"]} | {item["database_checksum_matches_runner"]} |')
          (out / 'migration-history-summary.md').write_text('\n'.join(migration_lines) + '\n', encoding='utf-8')
          test_lines = ['# PostgreSQL Test Report', '', f'- Exact commit SHA: {manifest["commit_sha"]}', f'- Workflow run: {manifest["workflow_run_id"]}', '', '## Test log summaries', '']
          for log_path in sorted((out / 'logs').glob('*.log')):
              lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()
              signals = [line.strip() for line in lines if (' passed' in line or ' failed' in line or 'PASSED' in line or 'FAILED' in line or 'PASS:' in line or 'ERROR' in line)]
              test_lines.append(f'### {log_path.name}')
              test_lines.extend([f'- {line}' for line in (signals[-12:] or ['No summary markers; inspect the full log.'])])
              test_lines.append('')
          (out / 'test-report.md').write_text('\n'.join(test_lines) + '\n', encoding='utf-8')
          # Bind the manifest, summaries, exact commit marker, and all logs into SHA256SUMS.
          checksum_targets = [out / 'manifest.json', out / 'commit-sha.txt', out / 'migration-history-summary.md', out / 'test-report.md'] + sorted((out / 'logs').glob('*'))
          sums = []
          for target in checksum_targets:
              if target.is_file():
                  sums.append(f"{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.relative_to(out)}")
          (out / 'SHA256SUMS').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          for line in (out / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              digest, relative = line.split('  ', 1)
              if hashlib.sha256((out / relative).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'SHA256SUMS verification failed: {relative}')
          if manifest['commit_sha'] != head_sha:
              raise SystemExit(f"evidence SHA mismatch: target={manifest['commit_sha']} HEAD={head_sha}")
          if database_error:
              raise SystemExit(f"PostgreSQL migration evidence unavailable: {database_error}")
          if database_rows and any(row['checksum'] != item['runner_checksum'] for row, item in zip(database_rows, canonical)):
              raise SystemExit('database migration checksum differs from canonical manifest')
          print(json.dumps({'commit_sha': manifest['commit_sha'], 'checked_out_head_sha': head_sha, 'commit_sha_matches_head': manifest['commit_sha_matches_head'], 'canonical_migration_count': len(canonical), 'schema_version_rows': len(database_rows), 'sha256sums': str(out / 'SHA256SUMS'), 'manifest': str(out / 'manifest.json')}, indent=2))
          PY

      - name: Test production entrypoint contract
        run: set -o pipefail; pytest -vv -s tests/services/test_production_entrypoint.py 2>&1 | tee artifacts/ea35/logs/production-entrypoint.log
      - name: Boot real PostgreSQL production runtime and validate schema
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from production_entrypoint import build_production_runtime
          from services.gerchain_runtime_factory import initialize_canonical_postgres_schema
          import os

          # Production boot requires pre-existing authoritative escrow truth.
          # Bootstrap schema first, then seed only the isolated CI database.
          engine = create_engine(os.environ["GERCHAIN_DATABASE_URL"], pool_pre_ping=True)
          initialize_canonical_postgres_schema(engine)
          with engine.begin() as connection:
              connection.execute(
                  text("""
                      INSERT INTO escrows
                          (id, sender_address, receiver_address, amount, state,
                           condition_desc, refund_destination, currency, version,
                           created_at, updated_at)
                      VALUES
                          (:id, :sender, :receiver, :amount, 'CREATED',
                           'CI production boot', :refund_destination, :currency, 0,
                           now(), now())
                      ON CONFLICT (id) DO NOTHING
                  """),
                  {
                      "id": os.environ["GERCHAIN_ESCROW_ID"],
                      "sender": "ci-source",
                      "receiver": "ci-beneficiary",
                      "amount": int(os.environ["GERCHAIN_ESCROW_AMOUNT"]),
                      "refund_destination": "ci-source",
                      "currency": os.environ["GERCHAIN_CURRENCY"],
                  },
              )
          engine.dispose()

          runtime, engine = build_production_runtime()
          try:
              assert runtime.is_canonical_ledger_authoritative
              required = {
                  "schema_version",
                  "escrows",
                  "gerchain_ledger_accounts",
                  "gerchain_ledger_movements",
                  "gerchain_transaction_witnesses",
                  "gerchain_outbox_events",
                  "gerchain_idempotency_records",
              }
              with engine.connect() as connection:
                  actual = set(inspect(connection).get_table_names())
                  missing = required - actual
                  assert not missing, f"missing canonical tables: {sorted(missing)}"
                  identity = connection.execute(text("SELECT current_database(), current_user, version()")).one()
                  line = f"PASS: runtime PostgreSQL connection: database={identity[0]}; user={identity[1]}; tables={len(actual)}; canonical_authority={runtime.is_canonical_ledger_authoritative}"
                  print(line)
                  from pathlib import Path
                  Path("artifacts/ea35/logs/postgres-connection-runtime.log").write_text(line + "\n", encoding="utf-8")
              print("PASS: real PostgreSQL boot and canonical authority verified")
          finally:
              engine.dispose()
          PY
      - name: Re-perform PostgreSQL backup and restore on isolated database
        id: disaster_recovery_evidence
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          mkdir -p artifacts/ea35/logs
          export PGPASSWORD=postgres
          SOURCE_DSN="postgresql://postgres:postgres@localhost:5432/gerchain_test"
          RESTORE_DSN="postgresql://postgres:postgres@localhost:5432/gerchain_restore_test"
          pg_dump --format=custom --no-owner --no-privileges --file artifacts/ea35/postgres-backup.dump "$SOURCE_DSN"
          test -s artifacts/ea35/postgres-backup.dump
          dropdb --if-exists --host=localhost --username=postgres gerchain_restore_test
          createdb --host=localhost --username=postgres gerchain_restore_test
          pg_restore --no-owner --no-privileges --dbname="$RESTORE_DSN" artifacts/ea35/postgres-backup.dump
          python - <<'PY' | tee artifacts/ea35/logs/disaster-recovery-restore.log
          from sqlalchemy import create_engine, inspect, text
          url = "postgresql+psycopg://postgres:postgres@localhost:5432/gerchain_restore_test"
          engine = create_engine(url, pool_pre_ping=True)
          try:
              with engine.connect() as conn:
                  versions = conn.execute(text("SELECT version FROM schema_version ORDER BY version")).scalars().all()
                  assert versions == list(range(1, 18)), f"restored schema history mismatch: {versions}"
                  tables = set(inspect(conn).get_table_names())
                  required = {
                      "escrows", "gerchain_ledger_accounts", "gerchain_ledger_movements",
                      "gerchain_transaction_witnesses", "gerchain_outbox_events",
                      "gerchain_idempotency_records",
                  }
                  missing = required - tables
                  assert not missing, f"restored canonical tables missing: {sorted(missing)}"
                  print(f"PASS: PostgreSQL backup/restore; restored migration versions={len(versions)}; canonical tables={len(required)}; missing={sorted(missing)}")
          finally:
              engine.dispose()
          PY
      - name: Deep value-truth reconciliation tests on PostgreSQL
        run: set -o pipefail; pytest -vv -s tests/persistence/test_deep_value_reconciliation_postgres.py 2>&1 | tee artifacts/ea35/logs/deep-value-reconciliation.log

      - name: Verify error duplicate excess invariants on exact SHA
        id: duplicate_excess_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q \
            tests/test_core_structure.py \
            tests/test_core_final_lock_contract.py \
            tests/test_boundary_adapters.py \
            tests/test_composition_root.py \
            tests/test_governed_flow_adapters.py \
            tests/test_nef_gerchain_boundary.py \
            tests/test_nef_gerchain_port.py \
            tests/test_postgres_atomic_ledger.py \
            tests/persistence/test_deep_value_reconciliation_postgres.py \
            --junitxml=artifacts/ea35/junit-duplicate-excess.xml \
            2>&1 | tee artifacts/ea35/logs/duplicate-excess-review.log
      - name: Verify cross-store reconciliation invariants
        id: cross_store_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/persistence/test_deep_value_reconciliation.py tests/persistence/test_value_reconciliation.py tests/test_operating_reconciliation.py 2>&1 | tee artifacts/ea35/logs/cross-store-reconciliation.log
      - name: Verify canonical authority boundaries
        id: authority_boundary_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/test_nef_gerchain_boundary.py tests/test_nef_gerchain_port.py tests/test_postgresql_runtime_authority.py tests/test_g3_core_boundary.py 2>&1 | tee artifacts/ea35/logs/authority-boundary.log
      - name: Verify CORE correctness
        id: core_correctness_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/test_core_structure.py tests/test_transaction_lifecycle.py tests/test_transaction_manager.py tests/services/test_gerchain_runtime_atomic_lifecycle.py tests/services/test_gerchain_runtime_canonical_ledger.py 2>&1 | tee artifacts/ea35/logs/core-correctness.log
      - name: Verify adapter boundaries
        id: adapter_boundaries_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/test_boundary_adapters.py tests/test_governed_flow_adapters.py tests/test_release_adapter.py tests/test_de_dee_adapter.py 2>&1 | tee artifacts/ea35/logs/adapter-boundaries.log
      - name: Verify EAI G3 governance boundary
        id: eai_g3_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/test_g3_core_runtime_e2e.py tests/test_g3_dee_authorized_handler.py tests/test_nef_g3_dee_gerchain_e2e.py tests/test_dee_settlement_governance.py 2>&1 | tee artifacts/ea35/logs/eai-g3-governance.log
      - name: Verify transaction correctness
        id: transaction_correctness_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/persistence/test_atomic_ledger_transaction_boundary.py tests/persistence/test_atomic_value_transaction.py tests/persistence/test_transactional_outbox.py tests/test_transaction_lifecycle.py 2>&1 | tee artifacts/ea35/logs/transaction-correctness.log
      - name: Verify restart and failure recovery
        id: recovery_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/persistence/test_ea35_restart_recovery.py tests/test_dee_recovery_governance.py tests/test_nef_state_recovery.py tests/test_postgres_outbox_recovery.py tests/test_release_processing_recovery.py tests/test_release_crash_recovery_contract.py 2>&1 | tee artifacts/ea35/logs/recovery.log
      - name: Verify auditability and observability controls
        id: auditability_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/test_operating_reconciliation.py tests/persistence/test_value_reconciliation.py tests/test_dee_runtime_governance.py tests/test_dee_security.py 2>&1 | tee artifacts/ea35/logs/auditability-observability.log
      - name: Verify load and stress behavior
        id: performance_stress_evidence
        if: always()
        run: |
          mkdir -p artifacts/ea35/logs
          set -o pipefail
          pytest -q tests/test_nef_load_stress.py tests/test_v860_load_stress.py tests/test_v861_consensus_load_stress.py 2>&1 | tee artifacts/ea35/logs/performance-stress.log
      - name: Finalize exact-SHA architecture gates and evidence bundle
        if: always()
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          DUPLICATE_EXCESS_OUTCOME: ${{ steps.duplicate_excess_evidence.outcome }}
          CROSS_STORE_OUTCOME: ${{ steps.cross_store_evidence.outcome }}
          AUTHORITY_BOUNDARY_OUTCOME: ${{ steps.authority_boundary_evidence.outcome }}
          CORE_CORRECTNESS_OUTCOME: ${{ steps.core_correctness_evidence.outcome }}
          ADAPTER_BOUNDARIES_OUTCOME: ${{ steps.adapter_boundaries_evidence.outcome }}
          EAI_G3_OUTCOME: ${{ steps.eai_g3_evidence.outcome }}
          TRANSACTION_CORRECTNESS_OUTCOME: ${{ steps.transaction_correctness_evidence.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery_evidence.outcome }}
          AUDITABILITY_OUTCOME: ${{ steps.auditability_evidence.outcome }}
          PERFORMANCE_STRESS_OUTCOME: ${{ steps.performance_stress_evidence.outcome }}
          DISASTER_RECOVERY_OUTCOME: ${{ steps.disaster_recovery_evidence.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("artifacts/ea35")
          root.mkdir(parents=True, exist_ok=True)
          # Discard any previous run's decision before generating fresh evidence.
          stale_decision = root / "production-gate-decision.json"
          if stale_decision.exists():
              stale_decision.unlink()
          expected = os.environ["EVIDENCE_COMMIT_SHA"]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          required = [
              root / "manifest.json",
              root / "commit-sha.txt",
              root / "migration-history-summary.md",
              root / "test-report.md",
              root / "SHA256SUMS",
              root / "logs" / "duplicate-excess-review.log",
              root / "junit-duplicate-excess.xml",
          ]
          base_files_exist = all(p.is_file() and p.stat().st_size > 0 for p in required)
          manifest = {}
          migration = {}
          if (root / "manifest.json").is_file():
              try: manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError): manifest = {}
          # Canonical migration evidence is intentionally embedded in manifest.json.
          # Avoid a second migration-manifest authority that the workflow does not emit.
          migration = manifest
          sha_bound = (
              head == expected
              and manifest.get("commit_sha") == expected
              and manifest.get("checked_out_head_sha") == expected
              and manifest.get("commit_sha_matches_head") is True
              and migration.get("commit_sha") == expected
              and migration.get("canonical_migration_count") == 17
              and len(migration.get("canonical_migrations", [])) == 17
              and len(migration.get("schema_version_rows", [])) == 17
              and all(item.get("database_checksum_matches_runner") is True
                      for item in migration.get("canonical_migrations", []))
              and (root / "commit-sha.txt").is_file()
              and (root / "commit-sha.txt").read_text(encoding="utf-8").strip() == expected
          )
          junit_ok = False
          junit_counts = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          junit = root / "junit-duplicate-excess.xml"
          if junit.is_file():
              try:
                  xml = ET.parse(junit).getroot()
                  suites = [xml] if xml.tag == "testsuite" else list(xml.iter("testsuite"))
                  junit_counts = {k: sum(int(s.attrib.get(k, "0")) for s in suites)
                                  for k in junit_counts}
                  junit_ok = junit_counts["tests"] > 0 and junit_counts["failures"] == 0 and junit_counts["errors"] == 0
              except (ET.ParseError, ValueError):
                  junit_ok = False
          review_doc = Path("docs/MASTER_PRODUCTION_WORK_PLAN_STEP2_ERROR_DUPLICATE_EXCESS.md")
          duplicate_pass = (
              os.environ.get("DUPLICATE_EXCESS_OUTCOME") == "success"
              and review_doc.is_file()
              and base_files_exist
              and sha_bound
              and junit_ok
          )
          # Build a machine-verifiable bundle index from real files only.
          evidence_files = []
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name not in {
                  "architecture-gates.json", "final-evidence-bundle.json",
                  "SHA256SUMS", "MANIFEST.SHA256"
              }:
                  evidence_files.append({
                      "path": p.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      "size_bytes": p.stat().st_size,
                  })
          bundle_complete = bool(base_files_exist and sha_bound and junit_ok and evidence_files)
          bundle_report = {
              "schema_version": "1.0",
              "commit_sha": expected,
              "checked_out_head_sha": head,
              "commit_sha_matches_head": head == expected,
              "status": "PASS" if bundle_complete else "BLOCKED",
              "duplicate_excess_junit": junit_counts,
              "evidence_files": evidence_files,
              "verification": {
                  "required_files_present": base_files_exist,
                  "exact_sha_binding": sha_bound,
                  "duplicate_excess_tests_passed": junit_ok,
                  "duplicate_excess_step_outcome": os.environ.get("DUPLICATE_EXCESS_OUTCOME"),
              },
          }
          (root / "final-evidence-bundle.json").write_text(
              json.dumps(bundle_report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          gates = (
              "inventory_map", "error_duplicate_excess", "cross_store_reconciliation",
              "authority_boundary", "core_correctness", "adapter_boundaries",
              "eai_g3_governance", "transaction_correctness", "recovery",
              "auditability", "security_iam_mfa", "observability",
              "performance_stress", "disaster_recovery", "ci_release_governance",
              "independent_reperformance", "final_evidence_bundle",
          )
          records = {name: {"outcome": "open", "evidence": ""} for name in gates}
          if (Path("docs/PRODUCTION_DATA_AUTHORITY_ADAPTER_MAP.md").is_file()
              and Path("docs/DEE_ARCHITECTURE_FREEZE.md").is_file()):
              records["inventory_map"] = {
                  "outcome": "success",
                  "evidence": f"https://github.com/{repo}/blob/{expected}/docs/PRODUCTION_DATA_AUTHORITY_ADAPTER_MAP.md",
              }
          if duplicate_pass:
              records["error_duplicate_excess"] = {
                  "outcome": "success",
                  "evidence": "logs/duplicate-excess-review.log",
              }
          operational_evidence = {
              "cross_store_reconciliation": ("CROSS_STORE_OUTCOME", "logs/cross-store-reconciliation.log"),
              "authority_boundary": ("AUTHORITY_BOUNDARY_OUTCOME", "logs/authority-boundary.log"),
              "core_correctness": ("CORE_CORRECTNESS_OUTCOME", "logs/core-correctness.log"),
              "adapter_boundaries": ("ADAPTER_BOUNDARIES_OUTCOME", "logs/adapter-boundaries.log"),
              "eai_g3_governance": ("EAI_G3_OUTCOME", "logs/eai-g3-governance.log"),
              "transaction_correctness": ("TRANSACTION_CORRECTNESS_OUTCOME", "logs/transaction-correctness.log"),
              "recovery": ("RECOVERY_OUTCOME", "logs/recovery.log"),
              "auditability": ("AUDITABILITY_OUTCOME", "logs/auditability-observability.log"),
              "observability": ("AUDITABILITY_OUTCOME", "logs/auditability-observability.log"),
              "performance_stress": ("PERFORMANCE_STRESS_OUTCOME", "logs/performance-stress.log"),
              "disaster_recovery": ("DISASTER_RECOVERY_OUTCOME", "logs/disaster-recovery-restore.log"),
          }
          for gate_name, (env_name, evidence_path) in operational_evidence.items():
              if os.environ.get(env_name) == "success" and (root / evidence_path).is_file():
                  records[gate_name] = {
                      "outcome": "success",
                      "evidence": evidence_path,
                  }
          # Organizational controls and independent review remain open until
          # independently verifiable evidence is supplied; tests/docs alone do
          # not prove MFA enforcement, branch rules, backup restoration, or reviewer independence.
          if bundle_complete:
              records["final_evidence_bundle"] = {
                  "outcome": "success",
                  "evidence": "final-evidence-bundle.json",
              }
          (root / "architecture-gates.json").write_text(
              json.dumps({"commit_sha": expected, "gates": records}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # The decision must be regenerated from this run's exact-SHA manifest
          # and observed gate outcomes. Unverified or missing gates remain failures.
          from scripts.production_gate_controller import decide
          outcomes = {name: record["outcome"] for name, record in records.items()}
          decision_report = decide(root / "manifest.json", expected, outcomes)
          (root / "production-gate-decision.json").write_text(
              json.dumps(decision_report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(decision_report, indent=2))

          # Final checksum index includes architecture gates, the evidence bundle,
          # and the fresh production decision. The index itself is separately bound.
          sums_path = root / "SHA256SUMS"
          files = sorted(p for p in root.rglob("*") if p.is_file()
                         and p.name not in {"SHA256SUMS", "MANIFEST.SHA256"})
          sums_path.write_text(
              "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files),
              encoding="utf-8",
          )
          sums_valid = True
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != digest:
                  sums_valid = False
                  break
          sums_hash = hashlib.sha256(sums_path.read_bytes()).hexdigest()
          (root / "MANIFEST.SHA256").write_text(f"{sums_hash}  SHA256SUMS\n", encoding="utf-8")
          sums_valid = sums_valid and hashlib.sha256(sums_path.read_bytes()).hexdigest() == sums_hash
          print(json.dumps({
              "commit_sha": expected,
              "checked_out_head_sha": head,
              "sha_bound": sha_bound,
              "duplicate_excess_step": os.environ.get("DUPLICATE_EXCESS_OUTCOME"),
              "duplicate_excess_junit": junit_counts,
              "error_duplicate_excess": records["error_duplicate_excess"]["outcome"],
              "final_evidence_bundle": records["final_evidence_bundle"]["outcome"],
              "sha256sums_valid": sums_valid,
              "open_architecture_gates": [k for k,v in records.items() if v["outcome"] != "success"],
          }, indent=2))
          if not sums_valid:
              raise SystemExit("FAIL: final evidence bundle checksum verification failed")
          PY
      - name: Upload final exact-SHA PostgreSQL evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea35-${{ github.sha }}
          path: artifacts/ea35/
          if-no-files-found: error
          retention-days: 90
