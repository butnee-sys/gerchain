name: Independent Production Audit

on:
  push:
    branches:
      - feat/ea21-transaction-aware-ledger
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-postgres-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: gerchain_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d gerchain_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GERCHAIN_DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/gerchain_audit
      GERCHAIN_TEST_DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/gerchain_audit
      GERCHAIN_POSTGRES_DSN: postgresql+psycopg://audit:audit@localhost:5432/gerchain_audit
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install EAI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r postgres/requirements-test.txt pytest
      - name: Record audit identity and PostgreSQL preflight
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          { echo "commit_sha=$(git rev-parse HEAD)"; echo "run_id=$GITHUB_RUN_ID"; echo "attempt=$GITHUB_RUN_ATTEMPT"; echo "postgres_image=postgres:16"; date -u; } | tee audit-artifacts/audit-metadata.txt
          python - <<'PY' | tee audit-artifacts/postgres-preflight.txt
          import os
          from sqlalchemy import create_engine, text
          e=create_engine(os.environ['GERCHAIN_DATABASE_URL'])
          with e.connect() as c:
              print('server_version:', c.execute(text('show server_version')).scalar())
              print('database:', c.execute(text('select current_database()')).scalar())
          e.dispose()
          PY
      - name: Collect EAI test suite only (fail closed)
        id: collect
        run: |
          set -euo pipefail
          python -m pytest --import-mode=importlib --collect-only -q \
            tests/persistence/test_atomic_ledger_transaction_boundary.py \
            tests/persistence/test_atomic_value_transaction.py \
            tests/persistence/test_cancel_escrow.py \
            tests/persistence/test_canonical_ledger_read.py \
            tests/persistence/test_deep_value_reconciliation.py \
            tests/persistence/test_deep_value_reconciliation_postgres.py \
            tests/persistence/test_fund_escrow.py \
            tests/persistence/test_lock_escrow.py \
            tests/persistence/test_refund_escrow.py \
            tests/persistence/test_settlement_coordinator.py \
            tests/persistence/test_value_reconciliation.py \
            tests/integration/test_eai_postgres_reperformance.py \
            tests/integration/test_eai_postgresql_lifecycle.py \
            tests/integration/test_eai_production_runtime.py \
            tests/integration/test_postgres_canonical_production.py \
            tests/integration/test_postgres_canonical_value_truth.py \
            tests/integration/test_production_entrypoint_bootstrap.py \
            tests/integration/test_production_runtime_factory_postgres.py \
            tests/production/test_eai_postgresql_runtime.py \
            tests/production/test_postgres_canonical_concurrency.py \
            tests/production/test_postgres_canonical_runtime.py \
            tests/services/test_gerchain_runtime_cancel_canonical.py \
            tests/services/test_gerchain_runtime_refund_canonical.py \
            tests/services/test_gerchain_runtime_settlement_canonical.py \
            tests/services/test_production_entrypoint.py \
            tests/services/test_production_runtime_factory.py \
            tests/services/test_production_runtime_factory_contract.py \
            tests/services/test_production_runtime_factory_postgres.py \
            2>&1 | tee audit-artifacts/pytest-collect.log
      - name: Run EAI persistence and runtime tests
        id: eai
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest --import-mode=importlib -q \
            tests/persistence/test_atomic_ledger_transaction_boundary.py \
            tests/persistence/test_atomic_value_transaction.py \
            tests/persistence/test_cancel_escrow.py \
            tests/persistence/test_canonical_ledger_read.py \
            tests/persistence/test_deep_value_reconciliation.py \
            tests/persistence/test_deep_value_reconciliation_postgres.py \
            tests/persistence/test_fund_escrow.py \
            tests/persistence/test_lock_escrow.py \
            tests/persistence/test_refund_escrow.py \
            tests/persistence/test_settlement_coordinator.py \
            tests/persistence/test_value_reconciliation.py \
            tests/integration/test_eai_postgres_reperformance.py \
            tests/integration/test_eai_postgresql_lifecycle.py \
            tests/integration/test_eai_production_runtime.py \
            tests/integration/test_postgres_canonical_production.py \
            tests/integration/test_postgres_canonical_value_truth.py \
            tests/integration/test_production_entrypoint_bootstrap.py \
            tests/integration/test_production_runtime_factory_postgres.py \
            tests/production/test_eai_postgresql_runtime.py \
            tests/production/test_postgres_canonical_concurrency.py \
            tests/production/test_postgres_canonical_runtime.py \
            tests/services/test_gerchain_runtime_cancel_canonical.py \
            tests/services/test_gerchain_runtime_refund_canonical.py \
            tests/services/test_gerchain_runtime_settlement_canonical.py \
            tests/services/test_production_entrypoint.py \
            tests/services/test_production_runtime_factory.py \
            tests/services/test_production_runtime_factory_contract.py \
            tests/services/test_production_runtime_factory_postgres.py \
            2>&1 | tee audit-artifacts/pytest-eai.log
      - name: Write audit verdict
        if: always()
        run: |
          { echo '# Automated EAI Production Audit'; echo; echo 'SHUUD and SANDBOX are separate projects and are excluded from this EAI test scope.'; echo 'This is automated evidence, not a production-ready certification.'; echo; echo "Commit: $(git rev-parse HEAD)"; echo "Collection: ${{ steps.collect.outcome }}"; echo "EAI tests: ${{ steps.eai.outcome }}"; } | tee audit-artifacts/audit-verdict.md
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eai-production-audit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce EAI gates
        if: always()
        run: |
          test "${{ steps.collect.outcome }}" = success
          test "${{ steps.eai.outcome }}" = success
