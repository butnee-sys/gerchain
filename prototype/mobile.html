<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>SHUUD — Гар утас</title><style>:root{--bg:#07111f;--p:#0d1b2d;--l:#1e334d;--t:#f5f8fc;--m:#91a4ba;--a:#35d49a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 32px}.brand{color:var(--a);font-weight:900;letter-spacing:.08em}.head{margin:20px 0}.head h1{font-size:30px;line-height:1.05;margin:5px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:18px;margin-top:14px}.field{margin:10px 0}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--l);background:#081625;color:var(--t);font:inherit}.field textarea{min-height:80px}button,a.button{display:block;width:100%;padding:14px;border:0;border-radius:13px;background:var(--a);color:#04140e;font-weight:850;font-size:16px;margin-top:8px;text-align:center;text-decoration:none}.secondary{background:#14273c!important;color:var(--t)!important;border:1px solid var(--l)!important}.status{font-size:19px;font-weight:800}.muted{color:var(--m)}.bar{height:10px;background:#14273c;border-radius:20px;overflow:hidden;margin:13px 0}.fill{height:100%;width:0;background:var(--a);transition:width .2s}.timer{font-size:42px;font-weight:900;text-align:center}.step{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(30,51,77,.7)}.step:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;background:#506176}.done .dot{background:var(--a)}.hide{display:none}.result{margin-top:14px;padding:14px;border-radius:12px;background:#102b29}.result b{font-size:20px}.error{color:#ffb4a9;font-size:13px;margin-top:10px}</style></head><body><main class="app"><div class="brand">SHUUD</div><div class="head"><div class="muted">Гар утасны шуурхай урсгал</div><h1>2 минутын дотор замаа чөлөөл.</h1></div><section id="report" class="card"><div class="status">Тохиолдол мэдээлэх</div><div class="field"><label>Байршил</label><input id="location" value="СБД · Энхтайвны өргөн чөлөө"></div><div class="field"><label>Тээврийн хэрэгсэл A</label><input id="vehicleA" value="UB-SHUUD-01"></div><div class="field"><label>Тээврийн хэрэгсэл B</label><input id="vehicleB" value="UB-SHUUD-02"></div><div class="field"><label>Тайлбар</label><textarea id="description">Хөнгөн замын тохиолдол, хүний гэмтэлгүй.</textarea></div><button id="startBtn">Тохиолдол мэдээлэх</button></section><section id="flow" class="card hide"><div class="timer" id="timer">120</div><div class="muted" style="text-align:center">секундийн зорилт</div><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status">Эхлүүлж байна…</div><div id="steps"><div class="step" data-s="incident"><span class="dot"></span>Тохиолдол мэдээлсэн</div><div class="step" data-s="evidence"><span class="dot"></span>Зураг, баримт баталгаажсан</div><div class="step" data-s="decision"><span class="dot"></span>SHIID шийдвэр</div><div class="step" data-s="escrow"><span class="dot"></span>Төлбөрийн эх үүсвэр</div><div class="step" data-s="clearance"><span class="dot"></span>Зам чөлөөлөгдсөн</div><div class="step" data-s="release"><span class="dot"></span>Төлбөр гарсан</div></div><div id="result" class="result hide"><b>Бүрэн мөчлөг дууслаа ✓</b><div id="resultText" class="muted" style="margin-top:5px"></div><a class="button" href="./economic-impact.html">Эдийн засгийн үр нөлөө →</a></div><div id="error" class="error"></div><button class="secondary" id="resetBtn">Шинэ тохиолдол</button></section></main><script>const API='/api/v1/shuud',SAPI='/api/v1/shuud/sandbox';let id,eid,startTime,timerHandle;const $=id=>document.getElementById(id);const post=async(p,b)=>{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||`${r.status} ${r.statusText}`);return d};const done=s=>document.querySelector(`[data-s="${s}"]`)?.classList.add('done');function tick(){const elapsed=(Date.now()-startTime)/1000,remain=Math.max(0,120-elapsed);$('timer').textContent=Math.ceil(remain);$('fill').style.width=Math.min(100,elapsed/1.2)+'%';if(remain>0)timerHandle=requestAnimationFrame(tick)}async function start(){if(timerHandle)cancelAnimationFrame(timerHandle);$('startBtn').disabled=true;$('report').classList.add('hide');$('flow').classList.remove('hide');$('error').textContent='';$('result').classList.add('hide');document.querySelectorAll('.step').forEach(x=>x.classList.remove('done'));startTime=Date.now();tick();try{const now=new Date().toISOString();const i=await post(API+'/incidents',{location_text:$('location').value,vehicle_a:$('vehicleA').value,vehicle_b:$('vehicleB').value,description:$('description').value,occurred_at:now});id=i.incident_id||i.id;done('incident');$('status').textContent='Зураг, баримт баталгаажуулж байна…';await post(API+'/evidence',{incident_id:id,evidence_refs:['demo:photo:front','demo:photo:damage'],gps_coordinates:'47.9184,106.9177',captured_at:now,vehicle_identity_refs:['vehicle-a','vehicle-b'],consent_refs:['party-a','party-b'],media_complete:true,timestamp_location_verified:true,vehicle_identity_verified:true});done('evidence');$('status').textContent='SHIID шийдвэр гаргаж байна…';const d=await post(API+'/decisions',{incident_id:id,two_party_consent:true,vehicle_identity_verified:true,timestamp_location_verified:true,media_complete:true,no_injury:true,no_third_party_property_damage:true,damage_estimate_mnt:1200000,dispute_present:false,fraud_flag:false,insurance_valid:true,beneficiary_valid:true,witness_verified:true});if(!d.release_authorized)throw Error('SHIID зөвшөөрөл олгосонгүй');done('decision');$('status').textContent='Төлбөрийн эх үүсвэр баталгаажуулж байна…';eid='ESC-'+id;await post(API+'/escrows',{incident_id:id,escrow_id:eid,amount_mnt:1200000,settlement_provider:'NEF'});done('escrow');$('status').textContent='Зам чөлөөлөлт бүртгэж байна…';const elapsed=(Date.now()-startTime)/1000;await post(API+'/metrics/clearance',{incident_id:id,clearance_seconds:elapsed});done('clearance');$('status').textContent='Төлбөр гаргаж байна…';await post(API+'/release',{incident_id:id,escrow_id:eid});done('release');const eco=await post(SAPI+'/metrics/'+id+'/economic',{baseline_seconds:600,clearance_seconds:elapsed,affected_vehicles:2,vehicle_value_per_minute_mnt:1000,insurer_cost_per_minute_mnt:500,public_road_cost_per_minute_mnt:800});$('status').textContent=elapsed<=120?'Зам чөлөөлөгдсөн · Төлбөр гарсан ✓':'Мөчлөг дууссан';$('resultText').textContent=`${elapsed.toFixed(1)} секунд · ${Math.round(eco.total_savings_mnt||0).toLocaleString('mn-MN')} MNT хэмжигдсэн өгөөж`;$('result').classList.remove('hide')}catch(e){$('status').textContent='Мөчлөг зогслоо';$('error').textContent=e.message}finally{$('startBtn').disabled=false;cancelAnimationFrame(timerHandle)}}$('startBtn').onclick=start;$('resetBtn').onclick=()=>location.reload();</script></body></html>
