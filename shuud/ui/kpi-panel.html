<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHUUD — Sandbox KPI</title><style>body{font:16px system-ui;margin:0;background:#07111f;color:#f4f7fb;padding:24px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0e1a2b;border:1px solid #223650;border-radius:16px;padding:18px}.v{font-size:30px;font-weight:800;margin-top:8px}.muted{color:#9eb0c5}.wide{grid-column:1/-1}button{background:#42d6a4;border:0;border-radius:10px;padding:10px 14px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p class="muted">SHUUD · 90 хоногийн Sandbox</p><h1>2 минутын дотор замаа чөлөөл</h1><p class="muted">Бодит хэмжилт дээр тулгуурласан удирдлагын үзүүлэлт</p><button onclick="load()">Өгөгдөл шинэчлэх</button><div class="grid" style="margin-top:18px"><div class="card"><span class="muted">Нийт тохиолдол</span><div class="v" id="cases">—</div></div><div class="card"><span class="muted">≤120 секунд</span><div class="v" id="rate">—</div></div><div class="card"><span class="muted">Дундаж хугацаа</span><div class="v" id="avg">—</div></div><div class="card"><span class="muted">Нийт хэмнэлт</span><div class="v" id="save">—</div></div><div class="card wide"><h2>Удирдлагын дүгнэлт</h2><p id="summary" class="muted">Ачааллаж байна…</p></div></div></div><script>async function load(){try{const r=await fetch('/api/v1/shuud/sandbox/kpi');if(!r.ok)throw Error('KPI API '+r.status);const x=await r.json();document.getElementById('cases').textContent=x.total_cases??0;document.getElementById('rate').textContent=x.within_two_minutes_rate==null?'—':Math.round(x.within_two_minutes_rate*100)+'%';document.getElementById('avg').textContent=x.avg_clearance_seconds==null?'—':Math.round(x.avg_clearance_seconds)+' сек';document.getElementById('save').textContent='₮'+Number(x.total_savings_mnt||0).toLocaleString('mn-MN');document.getElementById('summary').textContent=`${x.total_cases||0} тохиолдлоос ${x.within_two_minutes_cases||0} нь 120 секундийн зорилтод багтсан. Замын чөлөөлөлтийн хэмжилт бодит sandbox өгөгдлөөр шинэчлэгдэнэ.`}catch(e){document.getElementById('summary').textContent='KPI өгөгдөл одоогоор байхгүй эсвэл Sandbox API холбогдоогүй байна.'}}load();</script></body></html>
