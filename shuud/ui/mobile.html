<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>SHUUD — Mobile</title><style>:root{--bg:#07111f;--p:#0d1b2d;--l:#1e334d;--t:#f5f8fc;--m:#91a4ba;--a:#35d49a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 32px}.brand{color:var(--a);font-weight:900;letter-spacing:.08em}.head{margin:20px 0}.head h1{font-size:30px;line-height:1.05;margin:5px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:18px;margin-top:14px}.field{margin:10px 0}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--l);background:#081625;color:var(--t);font:inherit}.field textarea{min-height:80px}button{width:100%;padding:14px;border:0;border-radius:13px;background:var(--a);color:#04140e;font-weight:850;font-size:16px;margin-top:8px}.secondary{background:#14273c;color:var(--t);border:1px solid var(--l)}.status{font-size:19px;font-weight:800}.muted{color:var(--m)}.bar{height:10px;background:#14273c;border-radius:20px;overflow:hidden;margin:13px 0}.fill{height:100%;width:0;background:var(--a);transition:width .4s}.timer{font-size:42px;font-weight:900;text-align:center}.step{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(30,51,77,.7)}.step:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;background:#506176}.done .dot{background:var(--a)}.hide{display:none}</style></head><body><main class="app"><div class="brand">SHUUD</div><div class="head"><div class="muted">Шуурхай зам чөлөөлөлт</div><h1>2 минутын дотор замаа чөлөөл.</h1></div><section id="report" class="card"><div class="status">Тохиолдол мэдээлэх</div><div class="field"><label>Байршил</label><input id="location" value="СБД · Энхтайвны өргөн чөлөө"></div><div class="field"><label>Тээврийн хэрэгсэл A</label><input id="vehicleA" value="UB-SHUUD-01"></div><div class="field"><label>Тээврийн хэрэгсэл B</label><input id="vehicleB" value="UB-SHUUD-02"></div><div class="field"><label>Тайлбар</label><textarea id="description">SHUUD minor road incident</textarea></div><button onclick="start()">Тохиолдол мэдээлэх</button></section><section id="flow" class="card hide"><div class="timer" id="timer">120</div><div class="muted" style="text-align:center">секундийн зорилт</div><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status">Эхлүүлж байна…</div><div id="steps"><div class="step" data-s="incident"><span class="dot"></span>Тохиолдол мэдээлсэн</div><div class="step" data-s="evidence"><span class="dot"></span>Зураг, баримт баталгаажсан</div><div class="step" data-s="decision"><span class="dot"></span>SHIID шийдвэр</div><div class="step" data-s="escrow"><span class="dot"></span>Төлбөрийн эх үүсвэр</div><div class="step" data-s="clearance"><span class="dot"></span>Зам чөлөөлөгдсөн</div><div class="step" data-s="release"><span class="dot"></span>Төлбөр гарсан</div></div><button class="secondary" onclick="location.reload()">Шинэ тохиолдол</button></section></main><script>const API='/api/v1/shuud';let id,eid,startTime;const post=async(p,b)=>{const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()};const done=s=>document.querySelector('[data-s="'+s+'"]')?.classList.add('done');const wait=ms=>new Promise(r=>setTimeout(r,ms));function tick(){const elapsed=(Date.now()-startTime)/1000,remain=Math.max(0,120-elapsed);document.getElementById('timer').textContent=Math.ceil(remain);document.getElementById('fill').style.width=Math.min(100,elapsed/1.2)+'%';if(remain>0)requestAnimationFrame(tick)}async function start(){document.getElementById('report').classList.add('hide');document.getElementById('flow').classList.remove('hide');startTime=Date.now();tick();try{const now=new Date().toISOString();const i=await post('/incidents',{location:document.getElementById('location').value,vehicle_a:document.getElementById('vehicleA').value,vehicle_b:document.getElementById('vehicleB').value,description:document.getElementById('description').value,occurred_at:now});id=i.incident_id||i.id;done('incident');document.getElementById('status').textContent='Зураг, баримт баталгаажуулж байна…';await post('/evidence',{incident_id:id,evidence_refs:['photo-front','photo-damage'],gps_coordinates:'47.9184,106.9177',captured_at:now,vehicle_identity_refs:['vehicle-a'],consent_refs:['party-a','party-b'],media_complete:true});done('evidence');document.getElementById('status').textContent='SHIID шийдвэр гаргаж байна…';await post('/decisions',{incident_id:id,evidence_refs:['photo-front','photo-damage'],damage_estimate_mnt:1200000,two_party_consent:'PASS',vehicle_identity_verified:'PASS',timestamp_location_verified:'PASS',media_complete:'PASS',no_injury:'PASS',no_third_party_property_damage:'PASS',dispute_present:'PASS',fraud_flag:'PASS',insurance_valid:'PASS',beneficiary_valid:'PASS',witness_verified:'PASS'});done('decision');document.getElementById('status').textContent='Төлбөрийн эх үүсвэр баталгаажуулж байна…';eid='ESC-'+id;await post('/escrows',{incident_id:id,escrow_id:eid,amount_mnt:1200000,settlement_provider:'NEF'});done('escrow');document.getElementById('status').textContent='Зам чөлөөлөлтийн хугацааг хэмжиж байна…';await post('/metrics/clearance',{incident_id:id});done('clearance');document.getElementById('status').textContent='Төлбөр гаргаж байна…';await post('/release',{incident_id:id,escrow_id:eid});done('release');document.getElementById('status').textContent='Зам чөлөөлөгдсөн · Төлбөр гарсан ✓'}catch(e){document.getElementById('status').textContent='Алдаа: '+e.message}}</script></body></html>
